[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:allex]
command=python /app/allex/pipeline.py dashboard --serve --port 8081
directory=/app/allex
environment=BASE_PATH="/allex",PIPELINE_DB_PATH="/data/pipeline.db",HANDELSREGISTER_DB_PATH="/data/handelsregister.db",KNOWLEDGE_BASE_PATH="/data/knowledge_base.db"
user=appuser
priority=100
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dealroom]
command=python /app/dealroom/DEALROOM.py dashboard --serve --port 8082
directory=/app/dealroom
environment=BASE_PATH="/deals",DEALROOM_DB_PATH="/data/dealroom.db"
user=appuser
priority=200
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cockpit]
command=python /app/cockpit/cockpit.py serve --port 8083
directory=/app/cockpit
environment=COCKPIT_DB="/data/cockpit.db",COCKPIT_DEALROOM_DB="/data/dealroom.db"
user=appuser
priority=300
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:investor]
command=python /app/boardroom/boardroom.py serve --port 8084
directory=/app/boardroom
environment=INVESTOR_DB="/data/investor.db",INVESTOR_DEALROOM_DB="/data/dealroom.db",INVESTOR_PIPELINE_DB="/data/pipeline.db",INVESTOR_COCKPIT_DB="/data/cockpit.db"
user=appuser
priority=400
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
user=appuser
priority=999
startsecs=2
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
