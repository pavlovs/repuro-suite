// F19 — keyboard shortcuts at module scope (was bound inside renderRecord)
document.addEventListener('keydown', function(e) {
  // Alt+S / Alt+E fire even when a form field is focused
  var saveBtn = document.getElementById('btn-save');
  if (e.altKey && e.key === 's') { e.preventDefault(); if (saveBtn) saveBtn.click(); return; }
  if (e.altKey && e.key === 'e') { e.preventDefault(); sub.review = 'export'; showMode('review'); appEl.classList.remove('panel-open'); return; }
  if (e.altKey && e.key === 'f') { e.preventDefault(); sub.review = 'followup'; showMode('review'); appEl.classList.remove('panel-open'); return; }

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  // F34 — Arrow key navigation: Left/Up = previous, Right/Down = next record in queue
  if (mode === 'review' && sub.review === 'baprep') {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      var qrows = sortedRows().filter(matchesQueueFilter);
      var cur = qrows.findIndex(function(qr){ return qr._idx === activeIdx; });
      if (cur < qrows.length - 1) activeIdx = qrows[cur + 1]._idx;
      else if (qrows.length > 0) activeIdx = qrows[0]._idx;
      persistViewState();
      renderQueue();
      renderRecord();
      var activeEl = document.querySelector('.qitem.active');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      var qrows2 = sortedRows().filter(matchesQueueFilter);
      var cur2 = qrows2.findIndex(function(qr){ return qr._idx === activeIdx; });
      if (cur2 > 0) activeIdx = qrows2[cur2 - 1]._idx;
      else if (qrows2.length > 0) activeIdx = qrows2[qrows2.length - 1]._idx;
      persistViewState();
      renderQueue();
      renderRecord();
      var activeEl2 = document.querySelector('.qitem.active');
      if (activeEl2) activeEl2.scrollIntoView({ block: 'nearest' });
    }
  }

  // F35 — Alt+1 / Alt+2: switch preview tabs (Brief-Vorschau / Website)
  if (e.altKey && (e.key === '1' || e.key === '2')) {
    e.preventDefault();
    var targetTab = e.key === '1' ? 'letter' : 'site';
    var tabEl = document.querySelector('.preview-tab[data-tab="' + targetTab + '"]');
    if (tabEl && !tabEl.classList.contains('active')) tabEl.click();
  }
});

// F17 — iframe fallback: timer-based detection for X-Frame-Options blocks
function setupSiteIframeFallback() {
  var pb = document.getElementById('preview-body');
  if (!pb) return;
  var ifr = pb.querySelector('iframe');
  if (!ifr) return;
  var resolved = false;
  function showFallback() {
    if (resolved) return;
    resolved = true;
    ifr.style.display = 'none';
    var fb = ifr.nextElementSibling;
    if (fb) fb.style.display = 'flex';
  }
  var timer = setTimeout(showFallback, 4000);
  ifr.addEventListener('load', function() {
    if (resolved) return;
    resolved = true;
    clearTimeout(timer);
    try {
      var doc = ifr.contentDocument || ifr.contentWindow.document;
      if (!doc || !doc.body || doc.body.innerHTML.length === 0) {
        showFallback();
      }
    } catch(e) { /* cross-origin = loaded successfully, keep iframe visible */ }
  });
  ifr.addEventListener('error', function() {
    clearTimeout(timer);
    showFallback();
  });
}

// F26 — siteHtml uses safe escapeHtml + JS-attached onClick (no inline handler)
function siteHtml(r) {
  var domain = r.domain || '';

  var rawUrl = r.website || domain;
  var siteUrl = rawUrl.match(/^https?:\/\//) ? rawUrl : ('https://' + rawUrl);
  var safeDomain = escapeHtml(domain);
  var safeUrl = escapeHtml(siteUrl);
  return '<div class="site">' +
    '<div class="site-bar"><span class="muted">https://</span><span style="color:var(--ink);font-weight:500">' + safeDomain + '</span>' +
    '<div style="flex:1"></div><button class="btn sm ghost" id="btn-open-site">Neu öffnen ↗</button></div>' +
    '<iframe src="' + safeUrl + '" id="site-iframe" style="flex:1;border:none;width:100%;height:100%;"></iframe>' +
    '<div class="site-fallback">' +
    '<div>Website kann nicht eingebettet werden</div>' +
    '<a href="' + safeUrl + '" target="_blank" rel="noopener">In neuem Tab öffnen ↗</a>' +
    '</div></div>';
}

      '<label style="font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:4px">' +
        '<input type="checkbox" id="leads-show-prio2"' + (leadsShowPrio2 ? ' checked' : '') + '> Prio 2 anzeigen' +
      '</label>' +
      '<span class="lt-count" id="leads-count">' + fmt(total) + ' Records</span>' +
    '</div>' +
    '<div class="leads-table-wrap" id="leads-table-wrap"></div>' +
    '</div>';

  var searchInput = document.getElementById('leads-search');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      leadsSearch = searchInput.value;
      leadsPage = 0;
      renderLeadsTable();
    });
  }
  var batchSel = document.getElementById('leads-batch-filter');
  if (batchSel) {
    batchSel.addEventListener('change', function() {
      leadsBatchFilter = batchSel.value;
      leadsPage = 0;
      renderLeadsTable();
    });
  }
  var prio2Box = document.getElementById('leads-show-prio2');
  if (prio2Box) {
    prio2Box.addEventListener('change', function() {
      leadsShowPrio2 = prio2Box.checked;
      localStorage.setItem('allex_leads_show_prio2', leadsShowPrio2 ? '1' : '0');
      leadsPage = 0;
      renderLeadsTable();
    });
  }
  renderLeadsTable();
}

function exportLeadliste() {
  if (!SERVE_MODE) { showToast('Export nur im Live-Modus verfügbar', 'err'); return; }
  var allBox = document.getElementById('leads-export-all');
  var exportAll = allBox && allBox.checked ? '1' : '0';
  var batch = selectedBA || '';
  var url = '/api/export-leadliste?batch=' + encodeURIComponent(batch) + '&all=' + exportAll;
  var btn = document.getElementById('btn-export-excel');
  if (btn) { btn.disabled = true; btn.textContent = 'Lädt…'; }
  fetch(url)
    .then(function(resp) {
      if (!resp.ok) return resp.text().then(function(t) { throw new Error(t); });
      var disp = resp.headers.get('Content-Disposition') || '';
      var m = disp.match(/filename="(.+?)"/);
      var fname = m ? m[1] : 'leadliste.xlsx';
      return resp.blob().then(function(blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      });
    })
    .catch(function(e) { showToast('Excel-Export fehlgeschlagen: ' + (e.message || e), 'err'); })
    .finally(function() { if (btn) { btn.disabled = false; btn.textContent = '↓ Excel'; } });
}

function renderBatchOverview() {
  var root = document.getElementById('view-review');
  var allRecords = (DATA.records || []).slice();
  var batch = selectedBA || '';
  var rows = allRecords.filter(function(r) { return !batch || r.briefaktion === batch; });
  // Filter to Prio 1 only (batch overview is for active records)
  rows = rows.filter(function(r) { return r.prio === 'Prio 1'; });

  // Compute section status for each record
  var sdFields = ['owner_name', 'anrede', 'salutation', 'street', 'plz_ort'];
  var bvFields = ['leistung_text', 'compliment_draft', 'compliment_2', 'mehrwerte', 'gruppe_1', 'gruppe_2', 'gesellschafter_field'];
  var gapOnly = localStorage.getItem('allex_batch_gap_only') === '1';

  var enriched = rows.map(function(r, idx) {
    var sectionsReviewed = {};
    if (r.sections_reviewed) { try { sectionsReviewed = JSON.parse(r.sections_reviewed); } catch(e) {} }

    var sdFilled = sdFields.filter(function(f) { return r[f] && String(r[f]).trim(); }).length;
    var sdComplete = sdFilled === sdFields.length;
    var sdStatus = sdComplete ? (sectionsReviewed['stammdaten'] ? 'ok' : 'partial') : 'block';
    var sdMissing = sdFields.length - sdFilled;

    var bvFilled = bvFields.filter(function(f) { return r[f] && String(r[f]).trim(); }).length;
    var bvComplete = bvFilled === bvFields.length;
    var bvStatus = bvComplete ? (sectionsReviewed['briefvorbereitung'] ? 'ok' : 'partial') : 'block';
    var bvMissing = bvFields.length - bvFilled;

    var gsStatus = (r.pipeline_stage === 'ownership_review_needed') ? 'block' : (sectionsReviewed['gesellschafter'] ? 'ok' : 'partial');

    var hasGap = gsStatus !== 'ok' || sdStatus !== 'ok' || bvStatus !== 'ok';
    var approved = r.approved_for_sendout == 1;

    return Object.assign({}, r, {
      _origIdx: allRecords.indexOf(r),
      _gsStatus: gsStatus, _sdStatus: sdStatus, _bvStatus: bvStatus,
      _sdMissing: sdMissing, _bvMissing: bvMissing,
      _hasGap: hasGap, _approved: approved
    });
  });

  if (gapOnly) {
    enriched = enriched.filter(function(r) { return r._hasGap; });
  }

  // Summary stats
  var totalInBatch = rows.length;
  var withGaps = enriched.filter(function(r) { return r._hasGap; }).length;
  var approvedCount = enriched.filter(function(r) { return r._approved; }).length;
  var gsOk = enriched.filter(function(r) { return r._gsStatus === 'ok'; }).length;
  var sdOk = enriched.filter(function(r) { return r._sdStatus === 'ok'; }).length;
  var bvOk = enriched.filter(function(r) { return r._bvStatus === 'ok'; }).length;

  function statusPill(st, missing) {
    if (st === 'ok') return '<span class="bo-pill bo-ok">&#10003;</span>';
    if (st === 'partial') return '<span class="bo-pill bo-partial">Pr&uuml;fen</span>';
    return '<span class="bo-pill bo-block">' + (missing || '') + ' fehlt</span>';
  }
  function statusPillGs(st) {
    if (st === 'ok') return '<span class="bo-pill bo-ok">&#10003;</span>';
    if (st === 'partial') return '<span class="bo-pill bo-partial">Pr&uuml;fen</span>';
    return '<span class="bo-pill bo-block">offen</span>';
  }

  var headHtml = '<tr><th style="width:24px"></th><th>#</th><th>Name</th><th>Domain</th><th>Klass</th>' +
    '<th>Gesellschaft</th><th>Stammdaten</th><th>Brief</th><th>Freigabe</th></tr>';

  var bodyHtml = enriched.length === 0
    ? '<tr><td colspan="9" style="text-align:center;color:var(--ink-3);padding:32px">' +
      (batch ? 'Keine ' + (gapOnly ? 'Records mit L&uuml;cken' : 'Records') + ' in ' + escapeHtml(batch) : 'Kein Batch ausgew&auml;hlt') + '</td></tr>'
    : enriched.map(function(r) {
        var freigabe = r._approved ? '<span class="bo-pill bo-ok">&#10003;</span>' : '<span class="bo-pill bo-block">&mdash;</span>';
        return '<tr data-domain="' + escapeHtml(r.domain || '') + '" data-idx="' + r._origIdx + '">' +
          '<td style="text-align:center"><button class="btn-row-open" title="Im Review &ouml;ffnen">&rarr;</button></td>' +
          '<td class="num">' + (r._ref_id || r.id || '') + '</td>' +
          '<td>' + escapeHtml(r.full_name || '') + '</td>' +
          '<td class="lt-domain">' + escapeHtml(r.domain || '') + '</td>' +
          '<td>' + escapeHtml(r.klass || '') + '</td>' +
          '<td style="text-align:center">' + statusPillGs(r._gsStatus) + '</td>' +
          '<td style="text-align:center">' + statusPill(r._sdStatus, r._sdMissing) + '</td>' +
          '<td style="text-align:center">' + statusPill(r._bvStatus, r._bvMissing) + '</td>' +
          '<td style="text-align:center">' + freigabe + '</td>' +
          '</tr>';
      }).join('');

  root.innerHTML = '<div class="leads-page">' +
    '<div class="leads-toolbar">' +
      '<div style="display:flex;gap:16px;align-items:center">' +
        '<span style="font-weight:600;font-size:14px">' + escapeHtml(batch || 'Alle Batches') + '</span>' +
        '<span class="lt-count">' + fmt(enriched.length) + ' / ' + fmt(totalInBatch) + ' Records</span>' +
      '</div>' +
      '<div style="display:flex;gap:16px;align-items:center">' +
        '<label style="font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:4px">' +
          '<input type="checkbox" id="bo-gap-only"' + (gapOnly ? ' checked' : '') + '> Nur L&uuml;cken' +
        '</label>' +
        '<div class="bo-stats" style="font-size:11px;color:var(--ink-3)">' +
          'GS: ' + gsOk + '/' + totalInBatch + ' &middot; SD: ' + sdOk + '/' + totalInBatch + ' &middot; BV: ' + bvOk + '/' + totalInBatch + ' &middot; Freigabe: ' + approvedCount + '/' + totalInBatch +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="leads-table-wrap"><table class="leads-table bo-table"><thead>' + headHtml + '</thead><tbody>' + bodyHtml + '</tbody></table></div>' +
    '</div>';

  // Gap filter handler
  var gapBox = document.getElementById('bo-gap-only');
  if (gapBox) {
    gapBox.addEventListener('change', function() {
      localStorage.setItem('allex_batch_gap_only', gapBox.checked ? '1' : '0');
      renderBatchOverview();
    });
  }

  // Row click → open in Review
  root.querySelectorAll('.btn-row-open').forEach(function(btn) {
    var tr = btn.closest('tr');
    if (!tr) return;
    btn.addEventListener('click', function() {
      var idx = parseInt(tr.dataset.idx, 10);
      if (!isNaN(idx)) {
        currentIdx = idx;
        sub['review'] = 'baprep';
        renderSubnav();
        renderCurrent();
      }
    });
  });
}

function renderLeadsTable() {
  var wrap = document.getElementById('leads-table-wrap');
  var counter = document.getElementById('leads-count');
  if (!wrap) return;
  var allRecords = DATA.records || [];
  var term = (leadsSearch || '').toLowerCase().trim();
  var rows = allRecords.map(function(r, idx) {
    return Object.assign({}, r, { _origIdx: idx, _missing: missingFor(r).filter(function(m){ return m.severity !== 'done'; }).length });
  });
  if (leadsBatchFilter) {
    rows = rows.filter(function(r){ return r.briefaktion === leadsBatchFilter; });
  }
  if (!leadsShowPrio2) {
    rows = rows.filter(function(r){ return !(r.prio || '').startsWith('Prio 2'); });
  }
  if (term) {
    rows = rows.filter(function(r) {
      return (r.full_name || '').toLowerCase().indexOf(term) >= 0
        || (r.domain || '').toLowerCase().indexOf(term) >= 0
        || (r.region || '').toLowerCase().indexOf(term) >= 0
        || (r.pipeline_stage || '').toLowerCase().indexOf(term) >= 0
        || (r.gf_email || '').toLowerCase().indexOf(term) >= 0
        || (r.briefaktion || '').toLowerCase().indexOf(term) >= 0
        || (r.owner_name || '').toLowerCase().indexOf(term) >= 0;
    });
  }
  // Sort
  rows.sort(function(a, b) {
    var av = a[leadsSortField] || '';
    var bv = b[leadsSortField] || '';
    if (typeof av === 'number' && typeof bv === 'number') {
      return leadsSortDir === 'asc' ? av - bv : bv - av;
    }
    av = String(av).toLowerCase();
    bv = String(bv).toLowerCase();
    if (av < bv) return leadsSortDir === 'asc' ? -1 : 1;
    if (av > bv) return leadsSortDir === 'asc' ? 1 : -1;
    return 0;
  });
  var totalFiltered = rows.length;
  var totalPages = Math.max(1, Math.ceil(totalFiltered / LEADS_PAGE_SIZE));
  if (leadsPage >= totalPages) leadsPage = totalPages - 1;
  if (leadsPage < 0) leadsPage = 0;
  var pageStart = leadsPage * LEADS_PAGE_SIZE;
  rows = rows.slice(pageStart, pageStart + LEADS_PAGE_SIZE);
  if (counter) counter.textContent = fmt(totalFiltered) + ' / ' + fmt(allRecords.length) + ' Records · Seite ' + (leadsPage + 1) + '/' + totalPages;

  // Lead-Liste columns: # → briefaktion → full_name → rechtsform → klass → MA → region → reason cols → freigabe → missing
  var cols = [
    { id: '_ref_id',               label: '#',            sort: '_ref_id',              edit: 'readonly' },
    { id: 'briefaktion',           label: 'Batch',        sort: 'briefaktion',          edit: 'readonly' },
    { id: 'full_name',             label: 'Name',         sort: 'full_name',            edit: 'text' },
    { id: 'rechtsform',            label: 'Rechtsform',   sort: 'rechtsform',           edit: 'readonly' },
    { id: 'prio',                  label: 'Prio',         sort: 'prio',                 edit: 'select-prio' },
    { id: 'klass',                 label: 'Klass',        sort: 'klass',                edit: 'select-klass' },
    { id: 'ma_count',              label: 'MA',           sort: 'ma_count',             edit: 'readonly' },
    { id: 'region',                label: 'Region',       sort: 'region',               edit: 'text' },
    { id: 'filter_reason',         label: 'Filter-Grund', sort: 'filter_reason',        edit: 'readonly' },
    { id: 'ownership_reason',      label: 'Ownership',    sort: 'ownership_reason',     edit: 'readonly' },
    { id: 'reclassify_reason',     label: 'Reklassifiz.', sort: 'reclassify_reason',    edit: 'readonly' },
    { id: 'approved_for_sendout',  label: 'Druckfreigabe',sort: 'approved_for_sendout', edit: 'checkbox' },
    { id: '_missing',              label: 'Fehlt',        sort: '_missing',             edit: 'readonly' },
  ];

  // F25 — leftmost open-button column (in addition to the data cols)
  var headHtml = '<th style="width:24px"></th>' + cols.map(function(c) {
    var arrow = (leadsSortField === c.sort)
      ? (leadsSortDir === 'asc' ? '<span class="sort-arrow">▲</span>' : '<span class="sort-arrow">▼</span>')
      : '<span class="sort-arrow">·</span>';
    return '<th data-sort="' + c.sort + '">' + escapeHtml(c.label) + arrow + '</th>';
  }).join('');

  function renderCell(c, r) {
    var v = r[c.id];
    if (c.edit === 'select-prio') {
      var prioOptions = ['Prio 1','Prio 2 (small)','Prio 2 (big)','Prio 2 (intl)','Prio 2 (other)','Excluded'].map(function(opt) {
        return '<option value="' + opt + '"' + ((r.prio || '') === opt ? ' selected' : '') + '>' + opt + '</option>';
      }).join('');
      return '<td><select class="lt-edit lt-edit-prio" style="font-size:11px">' + prioOptions + '</select></td>';
    }
    if (c.edit === 'select-klass') {
      var klassOptions = ['DEA','INT','SER_PLA_1','SER_PLA_2','SER_MAI','SER_ITS','OEM','HEC','OOS','OTH','B2C','A','B','C','D','E','S'].map(function(opt) {
        return '<option value="' + opt + '"' + (r.klass === opt ? ' selected' : '') + '>' + opt + ' — ' + (KLASS_LABELS[opt] || opt) + '</option>';
      }).join('');
      return '<td><select class="lt-edit lt-edit-klass" title="' + (KLASS_LABELS[r.klass] || r.klass || '') + '">' + klassOptions + '</select></td>';
    }
    if (c.edit === 'select-anrede') {
      var anredeOptions = ['', 'Herr', 'Frau'].map(function(opt) {
        return '<option value="' + opt + '"' + (r.anrede === opt ? ' selected' : '') + '>' + (opt || '—') + '</option>';
      }).join('');
      return '<td><select class="lt-edit lt-edit-anrede">' + anredeOptions + '</select></td>';
    }
    if (c.edit === 'text') {
      var cellClass = (c.id === 'full_name') ? 'lt-name' : '';
      return '<td' + (cellClass ? ' class="' + cellClass + '"' : '') + '><input class="lt-edit lt-edit-' + c.id + '" type="text" value="' + escapeHtml(v || '') + '"/></td>';
    }
    if (c.edit === 'email') {
      return '<td><input class="lt-edit lt-edit-' + c.id + '" type="email" value="' + escapeHtml(v || '') + '"/></td>';
    }
    if (c.edit === 'pass-badge') {
      var passVal = (v === 1 || v === true) ? 1 : 0;
      var sym = passVal ? '✓' : '✗';
      return '<td><span class="lt-pass-' + passVal + '" data-field="filter_pass" data-val="' + passVal + '">' + sym + '</span></td>';
    }
    if (c.edit === 'checkbox') {
      var checked = (v === 1 || v === true) ? ' checked' : '';
      var disabledApprove = (r._missing > 0 && !checked) ? ' disabled title="Pflichtfelder fehlen"' : '';
      return '<td><input class="lt-edit lt-edit-approved" type="checkbox"' + checked + disabledApprove + '/></td>';
    }
    if (c.id === '_missing') {
      var missClass = r._missing === 0 ? 'ok' : (r._missing >= 4 ? 'block' : 'warn');
      return '<td class="lt-miss ' + missClass + ' num">' + r._missing + '</td>';
    }
    if (c.id === 'domain') {
      return '<td class="lt-domain">' + escapeHtml(v || '') + '</td>';
    }
    return '<td>' + escapeHtml(v == null ? '' : String(v)) + '</td>';
  }

  var bodyHtml = rows.length === 0
    ? '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;color:var(--ink-3);padding:32px">Keine Records gefunden</td></tr>'
    : rows.map(function(r) {
        var cells = cols.map(function(c) { return renderCell(c, r); }).join('');
        return '<tr data-domain="' + escapeHtml(r.domain || '') + '" data-idx="' + r._origIdx + '">' +
          '<td style="text-align:center"><button class="btn-row-open" title="Im Review öffnen">→</button></td>' +
          cells +
          '</tr>';
      }).join('');

  var paginationHtml = totalPages > 1
    ? '<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0;font-size:12px;color:var(--ink-3)">' +
        '<button id="leads-prev" style="padding:4px 12px"' + (leadsPage === 0 ? ' disabled' : '') + '>← Zurück</button>' +
        '<span>Seite ' + (leadsPage + 1) + ' / ' + totalPages + '</span>' +
        '<button id="leads-next" style="padding:4px 12px"' + (leadsPage >= totalPages - 1 ? ' disabled' : '') + '>Weiter →</button>' +
      '</div>'
    : '';
  wrap.innerHTML = '<table class="leads-table"><thead><tr>' + headHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table>' + paginationHtml;

  var prevBtn = document.getElementById('leads-prev');
  var nextBtn = document.getElementById('leads-next');
  if (prevBtn) prevBtn.addEventListener('click', function() { leadsPage--; renderLeadsTable(); });
  if (nextBtn) nextBtn.addEventListener('click', function() { leadsPage++; renderLeadsTable(); });

  // Sort click handlers
  wrap.querySelectorAll('th[data-sort]').forEach(function(th) {
    th.addEventListener('click', function() {
      var f = th.dataset.sort;
      if (leadsSortField === f) {
        leadsSortDir = leadsSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        leadsSortField = f;
        leadsSortDir = 'asc';
      }
      leadsPage = 0;
      renderLeadsTable();
    });
  });

  // F25 — explicit "open" button per row navigates to BA-Prep
  wrap.querySelectorAll('.btn-row-open').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var tr = btn.closest('tr');
      if (!tr) return;
      var idx = parseInt(tr.dataset.idx, 10);
      if (!isNaN(idx)) {
        activeIdx = idx;
        sub.review = 'baprep';
        renderSubnav();
        renderCurrent();
      }
    });
  });

  // Inline cell edits → blur/change to save
  function inlineSave(el, field) {
    var tr = el.closest('tr');
    if (!tr) return;
    var idx = parseInt(tr.dataset.idx, 10);
    if (isNaN(idx)) return;
    var rec = (DATA.records || [])[idx];
    if (!rec) return;
    var val = (el.type === 'checkbox') ? (el.checked ? 1 : 0) : el.value;
    rec[field] = val;
    if (SERVE_MODE) {
      var patch = {};
      patch[field] = val;
      patchCompany(rec.domain, patch).catch(function(e){ console.warn('patchCompany silent fail:', e); });
    }
  }
  wrap.querySelectorAll('.lt-edit-prio').forEach(function(el) {
    el.addEventListener('change', function(e){ e.stopPropagation(); inlineSave(el, 'prio'); renderLeadsTable(); });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-klass').forEach(function(el) {
    el.addEventListener('change', function(e){ e.stopPropagation(); inlineSave(el, 'klass'); });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-region').forEach(function(el) {
    el.addEventListener('blur', function(){
      inlineSave(el, 'region');
      var tr = el.closest('tr');
      if (!tr) return;
      var idx = parseInt(tr.dataset.idx, 10);
      if (isNaN(idx)) return;
      var rec = (DATA.records || [])[idx];
      if (!rec || !el.value) return;
      var cityLower = el.value.split(',')[0].trim().toLowerCase();
      var mapped = REGION_MAPPING && REGION_MAPPING[cityLower];
      var newRp = (mapped && mapped.region_prep) ? mapped.region_prep : ('in ' + el.value);
      rec.region_prep = newRp;
      if (SERVE_MODE) patchCompany(rec.domain, { region_prep: newRp }).catch(function(e){ console.warn('patchCompany silent fail:', e); });
    });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-anrede').forEach(function(el) {
    el.addEventListener('change', function(e){ e.stopPropagation(); inlineSave(el, 'anrede'); });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-full_name').forEach(function(el) {
    el.addEventListener('blur', function(){ inlineSave(el, 'full_name'); });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-owner_name').forEach(function(el) {
    el.addEventListener('blur', function(){ inlineSave(el, 'owner_name'); });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-gf_email').forEach(function(el) {
    el.addEventListener('blur', function(){ inlineSave(el, 'gf_email'); });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  wrap.querySelectorAll('.lt-edit-approved').forEach(function(el) {
    el.addEventListener('change', async function(e) {
      e.stopPropagation();
      var tr = el.closest('tr');
      if (!tr) return;
      var idx = parseInt(tr.dataset.idx, 10);
      if (isNaN(idx)) return;
      var rec = (DATA.records || [])[idx];
      if (!rec) return;
      var newVal = el.checked ? 1 : 0;
      if (newVal === 1 && missingFor(rec).filter(function(m){ return m.severity !== 'done'; }).length > 0) {
        el.checked = false; return;
      }
      var prev = rec.approved_for_sendout;
      var prevReviewed = rec.sections_reviewed;
      rec.approved_for_sendout = newVal;  // optimistic
      var patch = { approved_for_sendout: newVal };
      if (newVal === 1) {
        rec.sections_reviewed = JSON.stringify({gesellschafter:1,stammdaten:1,briefvorbereitung:1,notizen:1});
        patch.sections_reviewed = rec.sections_reviewed;
      }
      el.disabled = true;
      try {
        await patchCompany(rec.domain, patch);
        try {
          var resp = await fetch('/api/data');
          DATA = await resp.json();
          assignRefIds(DATA.records);
          renderLeadsTable();
        } catch (refreshErr) {
          console.warn('DATA refresh failed after approval PATCH; UI may be stale', refreshErr);
        }
      } catch (patchErr) {
        rec.approved_for_sendout = prev;
        rec.sections_reviewed = prevReviewed;
        el.checked = prev === 1;
        showToast('Freigabe konnte nicht gespeichert werden: ' + (patchErr.message || patchErr), 'err');
      } finally {
        el.disabled = false;
      }
    });
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  // filter_pass is pipeline-computed (hard filter verdict) — display-only, not editable
}

// ===== REVIEW › DROP-OFF =====
function _computeDropoffGlobal(allRecords) {
  var total = allRecords.length;
  var stages = [];
  stages.push({ stage: 'Ingest', sub: 'ORBIS · WLW · Manual', passed: total, dropped: 0, reasons: [] });
  var filteredPass = allRecords.filter(function(r){ return r.filter_pass === 1 || r.filter_pass == null; });
  var filteredDrop = allRecords.filter(function(r){ return r.filter_pass === 0; });
  var filterReasons = {};
  filteredDrop.forEach(function(r){ var k = r.filter_reason || 'Unknown'; filterReasons[k] = (filterReasons[k] || 0) + 1; });
  stages.push({ stage: 'Hard Filter', sub: 'Branche · Größe · Land', passed: filteredPass.length, dropped: filteredDrop.length,
    reasons: Object.keys(filterReasons).sort(function(a,b){ return filterReasons[b]-filterReasons[a]; }).map(function(k){ return {label:k, n:filterReasons[k]}; }) });
  var scrapeFail = filteredPass.filter(function(r){ return r.pipeline_stage === 'scrape_failed'; });
  var scrapePass = filteredPass.filter(function(r){ return r.pipeline_stage !== 'scrape_failed'; });
  stages.push({ stage: 'Scrape', sub: 'Website + Impressum', passed: scrapePass.length, dropped: scrapeFail.length,
    reasons: scrapeFail.length ? [{ label: 'Domain nicht erreichbar', n: scrapeFail.length }] : [] });
  var classified = scrapePass.filter(function(r){ return r.klass != null; });
  var notClassified = scrapePass.filter(function(r){ return r.klass == null; });
  var klassDE = classified.filter(function(r){ return r.klass === 'D' || r.klass === 'E'; });
  var klassPass = classified.filter(function(r){ return r.klass !== 'D' && r.klass !== 'E'; });
  var classReasons = [{ label: 'D/E — No-fit', n: klassDE.length }];
  if (notClassified.length) classReasons.push({ label: 'Nicht klassifiziert', n: notClassified.length });
  stages.push({ stage: 'Klassifizierung', sub: 'AI · A/B/C/D/E', passed: klassPass.length, dropped: klassDE.length + notClassified.length, reasons: classReasons });
  var ownershipExcl = klassPass.filter(function(r){ return r.prio === 'Excluded'; });
  var ownershipPass = klassPass.filter(function(r){ return r.prio !== 'Excluded'; });
  stages.push({ stage: 'Ownership Gate', sub: 'OpenRegister · Blocklist', passed: ownershipPass.length, dropped: ownershipExcl.length,
    reasons: ownershipExcl.length ? [{ label: 'Excluded — Konzerntochter / PE', n: ownershipExcl.length }] : [] });
  var abRecords = ownershipPass.filter(function(r){ return r.prio === 'Prio 1'; });
  var approved = abRecords.filter(function(r){ return r.approved_for_sendout == 1; });
  var notApproved = abRecords.filter(function(r){ return r.approved_for_sendout != 1; });
  stages.push({ stage: 'Freigabe', sub: 'Manueller Review', passed: approved.length, dropped: notApproved.length, reasons: [] });
  return stages;
}

function _computeDropoffBatch(batchRecords, ba) {
  var total = batchRecords.length;
  var stages = [];
  stages.push({ stage: 'Zugewiesen', sub: ba, passed: total, dropped: 0, reasons: [] });
  var passed = batchRecords.filter(function(r){ return r.prio === 'Prio 1'; });
  var dropped = batchRecords.filter(function(r){ return r.prio !== 'Prio 1'; });
  var dropReasons = {};
  dropped.forEach(function(r){
    var reason = r.prio === 'Duplicate' ? 'Duplikat' : (r.reclassify_reason || ('→ ' + (r.klass || '?')));
    dropReasons[reason] = (dropReasons[reason] || 0) + 1;
  });
  stages.push({ stage: 'Manuelle Prüfung', sub: 'Reklassifiziert nach Zuweisung', passed: passed.length, dropped: dropped.length,
    reasons: Object.keys(dropReasons).sort(function(a,b){ return dropReasons[b]-dropReasons[a]; }).map(function(k){ return {label:k, n:dropReasons[k]}; }) });
  var approved = passed.filter(function(r){ return r.approved_for_sendout == 1; });
  var notApproved = passed.filter(function(r){ return r.approved_for_sendout != 1; });
  stages.push({ stage: 'Freigabe', sub: 'Für Versand freigegeben', passed: approved.length, dropped: notApproved.length, reasons: [] });
  var sent = approved.filter(function(r){ return !!r.outreach_sent_at; });
  var notSent = approved.filter(function(r){ return !r.outreach_sent_at; });
  stages.push({ stage: 'Versendet', sub: 'Brief versendet', passed: sent.length, dropped: notSent.length, reasons: [] });
  return stages;
}

function renderReviewDropoff() {
  var root = document.getElementById('view-review');
  var allRecords = DATA.records || [];
  var stages, total, baLabel, headerQuestion;

  if (selectedBA) {
    var batchRecords = allRecords.filter(function(r){ return r.briefaktion === selectedBA; });
    stages = _computeDropoffBatch(batchRecords, selectedBA);
    total = batchRecords.length;
    baLabel = selectedBA;
    headerQuestion = 'Was passiert mit den ' + fmt(total) + ' zugewiesenen Targets in ' + selectedBA + '?';
    // stats computed after stages
  } else {
    stages = _computeDropoffGlobal(allRecords);
    total = allRecords.length;
    baLabel = 'Gesamte Pipeline';
    headerQuestion = 'Wo fielen die ' + fmt(total) + ' ingestierten Targets im Pipeline-Verlauf heraus?';
    // stats computed after stages
  }

  var finalPassed = stages.length > 0 ? stages[stages.length - 1].passed : 0;
  var totalDropped = total - finalPassed;

  var statsHtml;
  if (selectedBA) {
    var reklassifiziert = stages.length > 1 ? stages[1].dropped : 0;
    var freigegeben = stages.length > 2 ? stages[2].passed : 0;
    var versendet = stages.length > 3 ? stages[3].passed : 0;
    statsHtml = '<div class="ps"><div class="ps-num num">' + fmt(total) + '</div><div class="ps-lbl">Zugewiesen</div></div>' +
      '<div class="ps"><div class="ps-num num warn">' + fmt(reklassifiziert) + '</div><div class="ps-lbl">Reklassifiziert</div></div>' +
      '<div class="ps"><div class="ps-num num ok">' + fmt(freigegeben) + '</div><div class="ps-lbl">Freigegeben</div></div>' +
      '<div class="ps"><div class="ps-num num ok">' + fmt(versendet) + '</div><div class="ps-lbl">Versendet</div></div>';
  } else {
    statsHtml = '<div class="ps"><div class="ps-num num">' + fmt(total) + '</div><div class="ps-lbl">Ingestiert</div></div>' +
      '<div class="ps"><div class="ps-num num warn">' + fmt(totalDropped) + '</div><div class="ps-lbl">Herausgefallen</div></div>' +
      '<div class="ps"><div class="ps-num num ok">' + fmt(finalPassed) + '</div><div class="ps-lbl">Approved</div></div>';
  }

  var stagesHtml = stages.map(function(s, i) {
    var prev = i === 0 ? total : stages[i-1].passed;
    var passPct = prev > 0 ? Math.round((s.passed / prev) * 100) : 100;
    var dropPct = prev > 0 ? Math.round(((s.dropped || 0) / prev) * 100) : 0;
    var widthPass = total > 0 ? (s.passed / total) * 100 : 0;
    var reasons = s.reasons || [];
    var reasonsHtml = reasons.length > 0
      ? '<div class="dfreasons">' + reasons.map(function(reason) {
          var barW = (s.dropped || 0) > 0 ? (reason.n / s.dropped) * 100 : 0;
          return '<div class="dfreason"><span class="dfr-dot"></span><span class="dfr-label">' + escapeHtml(reason.label || '') + '</span><span class="dfr-bar"><span style="width:' + barW + '%"></span></span><span class="dfr-n num">' + fmt(reason.n) + '</span></div>';
        }).join('') + '</div>'
      : '';
    var dropCountHtml = (s.dropped || 0) > 0
      ? '<div class="dfc-drop"><span class="num">−' + fmt(s.dropped) + '</span><span class="dfc-lbl">' + dropPct + '% drop</span></div>'
      : '<div class="dfc-drop muted">keine Verluste</div>';

    return '<div class="dfstage">' +
      '<div class="dfstage-head"><div class="dfstage-meta"><div class="dfstage-step num">' + String(i+1).padStart(2,'0') + '</div>' +
      '<div><div class="dfstage-title">' + escapeHtml(s.stage || '') + '</div><div class="dfstage-sub">' + escapeHtml(s.sub || '') + '</div></div></div>' +
      '<div class="dfstage-counts"><div class="dfc-pass"><span class="num">' + fmt(s.passed) + '</span><span class="dfc-lbl">passieren · ' + passPct + '%</span></div>' + dropCountHtml + '</div></div>' +
      '<div class="dfflow"><div class="dfflow-pass" style="width:' + widthPass + '%"></div></div>' +
      reasonsHtml + '</div>';
  }).join('');

  var bas = (DATA.briefaktion_counts || []).map(function(b){ return b.briefaktion; }).filter(Boolean).sort();
  var baSelectHtml = '<select id="dropoff-ba-select" class="queue-ba-select" style="margin-left:12px;width:auto;min-width:120px">' +
    '<option value="">Gesamte Pipeline</option>' +
    bas.map(function(b){ return '<option value="' + escapeHtml(b) + '"' + (b === selectedBA ? ' selected' : '') + '>' + escapeHtml(b) + '</option>'; }).join('') +
    '</select>';

  root.innerHTML = '<div class="page"><div class="page-head"><div><h2 style="display:flex;align-items:center">Drop-off' + baSelectHtml + '</h2><p class="lead">' + escapeHtml(headerQuestion) + '</p></div>' +
    '<div class="page-stats">' + statsHtml + '</div></div>' +
    '<div class="dropflow">' + stagesHtml + '</div></div>';

  document.getElementById('dropoff-ba-select').onchange = function() {
    selectedBA = this.value;
    var mainSel = document.getElementById('ba-select');
    if (mainSel) mainSel.value = selectedBA;
    persistViewState();
    renderReviewDropoff();
  };
}

function renderActivityData(root, all) {
  if (!Array.isArray(all)) all = [];
  var claudeCount = all.filter(function(a){ return a.actor === 'claude'; }).length;
  var humanCount  = all.filter(function(a){ return a.actor !== 'claude'; }).length;
  var filtered = activityFilter === 'all' ? all : all.filter(function(a){ return a.actor === activityFilter; });

  function fmtTs(ts) {
    if (!ts) return '';
    // "2026-05-04T14:23:45.123456" or "2026-05-04 14:23:45" → "2026-05-04 14:23"
    return ts.replace('T', ' ').substring(0, 16);
  }
  function truncVal(v, len) {
    var s = String(v || '');
    return s.length > len ? s.substring(0, len) + '…' : s;
  }
  var SKIP_FIELDS = { 'sections_reviewed': true };

  var rowsHtml = filtered.length === 0
    ? '<div style="padding:24px;color:var(--ink-3);text-align:center">Keine Einträge</div>'
    : filtered.filter(function(a) {
        return !SKIP_FIELDS[a.field || a.field_name || ''];
      }).map(function(a) {
        var kind = a.kind || a.action_type || 'edit';
        var actorName = a.actor === 'claude' ? 'Claude' : (a.actor === 'flo' ? 'Flo' : 'Roman');
        var oldVal = truncVal(a.old || a.old_value || '', 60);
        var newVal = truncVal(a.neu || a.new || a.new_value || '', 60);
        return '<div class="actrow">' +
          '<div class="actcol-time num">' + escapeHtml(fmtTs(a.ts || a.changed_at || a.created_at || '')) + '</div>' +
          '<div class="actcol-actor"><span class="actor-dot ' + escapeHtml(a.actor || '') + '"></span><span class="actor-name">' + actorName + '</span><span class="act-kind ' + escapeHtml(kind) + '">' + kindLabel(kind) + '</span></div>' +
          '<div class="actcol-company">' + escapeHtml(a.company || a.domain || '') + '</div>' +
          '<div class="actcol-field"><code>' + escapeHtml(a.field || a.field_name || '') + '</code></div>' +
          '<div class="actcol-diff"><span class="diff-old">' + escapeHtml(oldVal) + '</span><svg viewBox="0 0 24 24" class="diff-arrow"><path d="M5 12h14M13 5l7 7-7 7"/></svg><span class="diff-new">' + escapeHtml(newVal) + '</span></div>' +
          '</div>';
      }).join('');

  root.innerHTML = '<div class="page">' +
    '<div class="page-head"><div><h2>Änderungslog</h2><p class="lead">Welche Felder wurden geändert — von Claude oder manuell?</p></div>' +
    '<div class="page-stats"><div class="ps"><div class="ps-num num">' + all.length + '</div><div class="ps-lbl">Änderungen</div></div>' +
    '<div class="ps"><div class="ps-num num"><span class="actor-dot claude"></span>' + claudeCount + '</div><div class="ps-lbl">Claude</div></div>' +
    '<div class="ps"><div class="ps-num num"><span class="actor-dot roman"></span>' + humanCount + '</div><div class="ps-lbl">Manuell</div></div></div></div>' +
    '<div class="actfilter">' +
      '<span class="qs-chip ' + (activityFilter==='all'?'active':'') + '" data-f="all">Alle</span>' +
      '<span class="qs-chip ' + (activityFilter==='claude'?'active':'') + '" data-f="claude">Nur Claude</span>' +
      '<span class="qs-chip ' + (activityFilter==='roman'?'active':'') + '" data-f="roman">Nur manuell</span>' +
    '</div>' +
    '<div class="actlog">' + rowsHtml + '</div></div>';

  root.querySelectorAll('.qs-chip[data-f]').forEach(function(c) {
    c.addEventListener('click', function() {
      activityFilter = c.dataset.f;
      renderActivityData(root, all);
    });
  });
}

function kindLabel(k) {
  return ({ gen:'AI generiert', regen:'AI re-generiert', enrich:'Enrichment', edit:'Manuell', approve:'Freigabe', system:'System' })[k] || k;
}

// ===== REVIEW › EXPORT =====
function renderExportView() {
  var root = document.getElementById('view-review');
  var ba = selectedBA;
  var records = (DATA.records || []).filter(function(r) { return r.briefaktion === ba; });

  // Categorize records into three groups
  var bereit = [], luecken = [], versendet = [];
  records.forEach(function(r) {
    var miss = missingFor(r).filter(function(m) { return m.severity !== 'done'; });
    var rec = {
      domain: r.domain,
      full_name: r.full_name || r.domain,
      klass: r.klass,
      owner_name: r.owner_name || '',
      approved: r.approved_for_sendout == 1,
      missing_count: miss.length,
      missing_names: miss.map(function(m) { return m.label || m.key; }).join(', '),
      eligible: isExportEligible(r),
      ref_id: r._ref_id,
      prio: r.prio || '',
      sent_at: r.outreach_sent_at || '',
      _idx: r._idx
    };
    if (r.outreach_sent_at) {
      versendet.push(rec);
    } else if (rec.approved && rec.missing_count === 0) {
      bereit.push(rec);
    } else if (rec.approved) {
      luecken.push(rec);
    }
  });
  bereit.sort(function(a, b) { return (a.ref_id || 0) - (b.ref_id || 0); });
  luecken.sort(function(a, b) { return (a.ref_id || 0) - (b.ref_id || 0); });
  versendet.sort(function(a, b) { return (a.ref_id || 0) - (b.ref_id || 0); });

  // Empty states
  if (!ba) {
    root.innerHTML = '<div class="export-page"><div class="export-empty">Kein Batch ausgewählt</div></div>';
    return;
  }
  if (records.length === 0) {
    root.innerHTML = '<div class="export-page"><div class="export-empty">Keine Records in ' + escapeHtml(ba) + ' zugewiesen</div></div>';
    return;
  }
  if (!bereit.length && !luecken.length && !versendet.length) {
    root.innerHTML = '<div class="export-page"><div class="export-empty">Noch keine Records freigegeben. <a href="#" id="export-back-link">Zurück zum Review →</a></div></div>';
    var backLink = document.getElementById('export-back-link');
    if (backLink) backLink.addEventListener('click', function(e) { e.preventDefault(); sub.review = 'baprep'; renderSubnav(); renderCurrent(); });
    return;
  }

  // Build table rows for each group
  function buildRow(rec, group) {
    var statusCls, statusText, checkboxCell;
    if (group === 'bereit') {
      statusCls = 'ready';
      statusText = '✓ Bereit';
      checkboxCell = '<td style="width:32px;text-align:center"><input type="checkbox" class="exp-cb" data-domain="' + escapeHtml(rec.domain) + '"></td>';
    } else if (group === 'luecken') {
      statusCls = 'gaps';
      statusText = '⚠ ' + rec.missing_count + ' fehlen';
      checkboxCell = '<td style="width:32px"></td>';
    } else {
      statusCls = 'sent';
      statusText = 'Versendet' + (rec.sent_at ? ' · ' + escapeHtml(rec.sent_at) : '');
      checkboxCell = '<td style="width:32px"></td>';
    }
    return '<tr class="export-row ' + statusCls + '" data-domain="' + escapeHtml(rec.domain) + '">' +
      checkboxCell +
      '<td class="exp-id num" style="width:40px;text-align:right;color:var(--ink-3);font-size:11px">' + (rec.ref_id || '—') + '</td>' +
      '<td class="exp-name">' + escapeHtml(rec.full_name) + '</td>' +
      '<td class="exp-klass"><span class="badge ' + (rec.klass || '').toLowerCase() + '">' + escapeHtml(rec.klass || '—') + '</span></td>' +
      '<td class="exp-ap">' + escapeHtml(rec.owner_name) + '</td>' +
      '<td class="exp-prio" style="font-size:11px">' + escapeHtml(rec.prio) + '</td>' +
      '<td class="exp-status ' + statusCls + '">' + statusText + '</td>' +
    '</tr>';
  }

  var tableRows = bereit.map(function(r) { return buildRow(r, 'bereit'); })
    .concat(luecken.map(function(r) { return buildRow(r, 'luecken'); }))
    .concat(versendet.map(function(r) { return buildRow(r, 'versendet'); }))
    .join('');

  // Counts
  var countsText = bereit.length + ' bereit';
  if (versendet.length) countsText += ' · ' + versendet.length + ' versendet';

  root.innerHTML = '<div class="export-page">' +
    '<div class="export-header">' +
      '<span class="export-title">Export — ' + escapeHtml(ba) + '</span>' +
      '<span class="export-counts">' + countsText + '</span>' +
    '</div>' +
    '<div class="export-table-wrap"><table class="export-table">' +
      '<thead><tr>' +
        '<th style="width:32px;text-align:center"><input type="checkbox" id="exp-select-all"></th>' +
        '<th style="width:40px">#ID</th><th>Firma</th><th>Klass</th><th>Ansprechpartner</th><th>Prio</th><th>Status</th>' +
      '</tr></thead>' +
      '<tbody>' + tableRows + '</tbody>' +
    '</table></div>' +
    '<div class="export-actions">' +
      '<button class="btn" id="btn-mark-sent" disabled>Als Versendet markieren</button>' +
      '<button class="btn" id="btn-export-pdf">Export PDF</button>' +
      '<button class="btn" id="btn-export-excel">Export Excel</button>' +
      '<button class="btn" id="btn-export-briefmarken">Export Briefmarken</button>' +
    '</div>' +
  '</div>';

  // Helper: get checked domains
  function checkedDomains() {
    var domains = [];
    root.querySelectorAll('.exp-cb:checked').forEach(function(cb) {
      domains.push(cb.getAttribute('data-domain'));
    });
    return domains;
  }

  // Helper: update mark-sent button state
  function updateMarkSentBtn() {
    var btn = document.getElementById('btn-mark-sent');
    if (btn) btn.disabled = checkedDomains().length === 0;
  }

  // Wire select-all checkbox
  var selectAll = document.getElementById('exp-select-all');
  if (selectAll) selectAll.addEventListener('change', function() {
    var checked = selectAll.checked;
    root.querySelectorAll('.exp-cb').forEach(function(cb) { cb.checked = checked; });
    updateMarkSentBtn();
  });

  // Wire individual checkboxes
  root.querySelectorAll('.exp-cb').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var allCbs = root.querySelectorAll('.exp-cb');
      var allChecked = Array.prototype.every.call(allCbs, function(c) { return c.checked; });
      if (selectAll) selectAll.checked = allChecked;
      updateMarkSentBtn();
    });
  });

  // Wire "Als Versendet markieren"
  var markSentBtn = document.getElementById('btn-mark-sent');
  if (markSentBtn) markSentBtn.addEventListener('click', function() {
    var domains = checkedDomains();
    if (!domains.length) return;
    fetch('/api/batch-send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({batch: ba, domains: domains})
    }).then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.ok) {
        var rows = DATA.records.filter(function(r) { return domains.indexOf(r.domain) >= 0; });
        rows.forEach(function(r) { r.outreach_sent_at = result.sent_at; });
        renderExportView();
      }
    });
  });

  // Wire Export PDF
  var pdfBtn = document.getElementById('btn-export-pdf');
  if (pdfBtn) pdfBtn.addEventListener('click', function() { exportPdf(); });

  // Wire Briefmarken Export
  var bmBtn = document.getElementById('btn-export-briefmarken');
  if (bmBtn) bmBtn.addEventListener('click', function() {
    var orig = bmBtn.textContent;
    bmBtn.disabled = true; bmBtn.textContent = 'Exportiert…';
    fetch('/api/export-briefmarken?batch=' + encodeURIComponent(ba))
      .then(function(resp) {
        if (!resp.ok) {
          if (resp.status === 404) throw new Error('Keine freigegebenen Records in ' + ba);
          throw new Error('Server-Fehler ' + resp.status);
        }
        return resp.blob();
      })
      .then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'briefmarken_' + ba + '.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        bmBtn.textContent = 'Heruntergeladen ✓';
        setTimeout(function(){ bmBtn.textContent = orig; bmBtn.disabled = false; }, 3000);
      })
      .catch(function(e) {
        showToast('Briefmarken-Export: ' + (e && e.message ? e.message : e), 'err');
        bmBtn.textContent = orig; bmBtn.disabled = false;
      });
  });

  // Wire Excel Export
  var excelBtn = document.getElementById('btn-export-excel');
  if (excelBtn) excelBtn.addEventListener('click', function() { exportLeadliste(); });

  // Wire row click → navigate to record in Review view
  root.querySelectorAll('.export-row').forEach(function(row) {
    row.addEventListener('click', function(e) {
      if (e.target.tagName === 'INPUT') return;
      var domain = row.getAttribute('data-domain');
      var idx = (DATA.records || []).findIndex(function(r) { return r.domain === domain; });
      if (idx >= 0) {
        activeIdx = idx;
        sub.review = 'baprep';
        renderSubnav();
        renderCurrent();
      }
    });
  });
}

function renderFollowUpView() {

  var ba = selectedBA;

  if (!ba) {
    root.innerHTML = '<div class="export-page"><div class="export-empty">Kein Batch ausgewählt</div></div>';

  }

  var sent = (DATA.records || []).filter(function(r) {

  });

  if (sent.length === 0) {
    root.innerHTML = '<div class="export-page"><div class="export-empty">Keine versendeten Records in ' + escapeHtml(ba) + '</div></div>';
    return;
  }

  sent.sort(function(a, b) { return (a._ref_id || 0) - (b._ref_id || 0); });

  // Summary counts
  var nTotal = sent.length;
  var nFU1 = 0, nFU2 = 0, nContact = 0, nMeeting = 0, nDeclined = 0;
  sent.forEach(function(r) {
    var s = r.outreach_status;
    if (s === 'followup1') nFU1++;
    else if (s === 'followup2') nFU2++;
    else if (s === 'contact') nContact++;
    else if (s === 'meeting') nMeeting++;
    else if (s === 'declined') nDeclined++;
  });

  var statusOptions = ['', 'followup1', 'followup2', 'contact', 'meeting', 'financials', 'declined', 'hold'];
  var statusLabels = { '': '—', followup1: 'Follow-Up 1', followup2: 'Follow-Up 2', contact: 'Kontakt', meeting: 'Meeting', financials: 'Financials', declined: 'Abgesagt', hold: 'Hold' };

  var tableRows = sent.map(function(r) {
    var domain = r.domain;
    var curStatus = r.outreach_status || '';
    var opts = statusOptions.map(function(val) {
      return '<option value="' + escapeHtml(val) + '"' + (val === curStatus ? ' selected' : '') + '>' + escapeHtml(statusLabels[val] || val) + '</option>';
    }).join('');

    var fu1Val = (r.followup1_at || '').substring(0, 10);
    var fu2Val = (r.followup2_at || '').substring(0, 10);
    var commentVal = r.followup_comment || '';

    var emailCell = r.gf_email ? '<a href="mailto:' + escapeHtml(r.gf_email) + '">' + escapeHtml(r.gf_email) + '</a>' : '—';
    var phoneCell = r.gf_phone ? '<a href="tel:' + escapeHtml(r.gf_phone) + '">' + escapeHtml(r.gf_phone) + '</a>' : '—';

    return '<tr data-domain="' + escapeHtml(domain) + '">' +
      '<td class="fu-firma"><a href="#" class="fu-nav" data-domain="' + escapeHtml(domain) + '">' + escapeHtml(r.full_name || domain) + '</a></td>' +
      '<td>' + escapeHtml(r.owner_name || '—') + '</td>' +
      '<td class="fu-contact">' + emailCell + '</td>' +
      '<td class="fu-contact">' + phoneCell + '</td>' +
      '<td><select class="fu-status" data-domain="' + escapeHtml(domain) + '">' + opts + '</select></td>' +
      '<td><input type="date" class="fu-date1" data-domain="' + escapeHtml(domain) + '" value="' + escapeHtml(fu1Val) + '"></td>' +
      '<td><input type="date" class="fu-date2" data-domain="' + escapeHtml(domain) + '" value="' + escapeHtml(fu2Val) + '"></td>' +
      '<td><input type="text" class="fu-comment" data-domain="' + escapeHtml(domain) + '" value="' + escapeHtml(commentVal) + '" placeholder="Kommentar..."></td>' +
    '</tr>';
  }).join('');

  var summaryParts = [nTotal + ' versendet'];
  if (nFU1) summaryParts.push(nFU1 + ' Follow-Up 1');
  if (nFU2) summaryParts.push(nFU2 + ' Follow-Up 2');
  if (nContact) summaryParts.push(nContact + ' Kontakt');
  if (nMeeting) summaryParts.push(nMeeting + ' Meeting');
  if (nDeclined) summaryParts.push(nDeclined + ' Abgesagt');

  root.innerHTML = '<div class="export-page">' +
    '<div class="export-header">' +
      '<span class="export-title">Follow-Up — ' + escapeHtml(ba) + '</span>' +
    '</div>' +
    '<div class="fu-summary">' + escapeHtml(summaryParts.join(' · ')) + '</div>' +
    '<div class="export-table-wrap"><table class="fu-table">' +
      '<thead><tr><th>Firma</th><th>Ansprechperson</th><th>Email</th><th>Telefon</th><th>Status</th><th>FU 1</th><th>FU 2</th><th>Kommentar</th></tr></thead>' +
      '<tbody>' + tableRows + '</tbody>' +
    '</table></div>' +
  '</div>';

  // Wire firma links → navigate to record in Review view
  root.querySelectorAll('.fu-nav').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var domain = link.getAttribute('data-domain');
      var idx = (DATA.records || []).findIndex(function(r) { return r.domain === domain; });
      if (idx >= 0) {
        activeIdx = idx;
        sub.review = 'baprep';
        renderSubnav();
        renderCurrent();
      }
    });
  });

  // Wire status dropdown
  root.querySelectorAll('.fu-status').forEach(function(sel) {
    sel.addEventListener('change', async function() {
      var domain = sel.getAttribute('data-domain');
      try {
        await patchCompany(domain, { outreach_status: sel.value });
        var rec = (DATA.records || []).find(function(r) { return r.domain === domain; });
        if (rec) rec.outreach_status = sel.value;
        showToast('Status → ' + (statusLabels[sel.value] || sel.value));
      } catch (err) {
        showToast('Fehler: ' + err.message, 'err');
      }
    });
  });

  // Wire FU 1 date
  root.querySelectorAll('.fu-date1').forEach(function(inp) {
    inp.addEventListener('change', async function() {
      var domain = inp.getAttribute('data-domain');
      try {
        await patchCompany(domain, { followup1_at: inp.value });
        var rec = (DATA.records || []).find(function(r) { return r.domain === domain; });
        if (rec) rec.followup1_at = inp.value;
        showToast('FU 1 gespeichert');
      } catch (err) {
        showToast('Fehler: ' + err.message, 'err');
      }
    });
  });

  // Wire FU 2 date
  root.querySelectorAll('.fu-date2').forEach(function(inp) {
    inp.addEventListener('change', async function() {
      var domain = inp.getAttribute('data-domain');
      try {
        await patchCompany(domain, { followup2_at: inp.value });
        var rec = (DATA.records || []).find(function(r) { return r.domain === domain; });
        if (rec) rec.followup2_at = inp.value;
        showToast('FU 2 gespeichert');
      } catch (err) {
        showToast('Fehler: ' + err.message, 'err');
      }
    });
  });

  // Wire comment blur
  root.querySelectorAll('.fu-comment').forEach(function(inp) {
    inp.addEventListener('blur', async function() {
      var domain = inp.getAttribute('data-domain');
      var rec = (DATA.records || []).find(function(r) { return r.domain === domain; });
      var oldVal = (rec && rec.followup_comment) || '';
      if (inp.value === oldVal) return;
      try {
        await patchCompany(domain, { followup_comment: inp.value });
        if (rec) rec.followup_comment = inp.value;
        showToast('Kommentar gespeichert');
      } catch (err) {
        showToast('Fehler: ' + err.message, 'err');
      }
    });
  });
}

// ===== ANALYZE › FUNNEL =====
function renderAnalyzeFunnel() {
  var root = document.getElementById('view-analyze');
  var rows;
  var heading = 'Pipeline-Funnel · Alle Batches';

  if (selectedBA) {
    // Client-side computation from BA-filtered records
    var all = getFilteredRows();
    var t = all.length || 1;
    heading = 'Pipeline-Funnel · ' + selectedBA;
    var scragedStages = ['scraped','scrape_failed','classified','ownership_enriched','ownership_review_needed','ownership_gated','email_enriched'];
    rows = [
      { stage: 'Total',      sub: selectedBA,              n: all.length,                                                                      pct: 100 },
      { stage: 'Filtered',   sub: 'Hard Filter',           n: all.filter(function(r){ return r.filter_pass !== 0; }).length,                   pct: 0 },
      { stage: 'Scraped',    sub: 'Website + Impressum',   n: all.filter(function(r){ return scragedStages.indexOf(r.pipeline_stage) >= 0; }).length, pct: 0 },
      { stage: 'Classified', sub: 'AI · A/B/C/D/E',       n: all.filter(function(r){ return r.klass; }).length,                               pct: 0 },
      { stage: 'A / B',      sub: 'Platform + Add-on',     n: all.filter(function(r){ return r.prio === 'Prio 1'; }).length,    pct: 0 },
      { stage: 'Approached', sub: 'Mit Batch',             n: all.filter(function(r){ return r.already_approached; }).length,                  pct: 0 },
    ];
    rows.forEach(function(r){ r.pct = (r.n / t) * 100; });
  } else {
    var funnel = DATA.funnel || {};
    var isArray = Array.isArray(funnel);
    if (isArray && funnel.length > 0) {
      rows = funnel;
    } else if (!isArray && typeof funnel === 'object') {
      var stageMap = [
        { stage: 'Total',      sub: 'Alle Records',        key: 'Total' },
        { stage: 'Filtered',   sub: 'Hard Filter',         key: 'Filtered' },
        { stage: 'Scraped',    sub: 'Website + Impressum', key: 'Scraped' },
        { stage: 'Classified', sub: 'AI · A/B/C/D/E',     key: 'Classified' },
        { stage: 'A / B',      sub: 'Platform + Add-on',   key: null },
        { stage: 'Approached', sub: 'Mit Batch',           key: 'Approached' },
      ];
      var totalN = funnel['Total'] || 1;
      rows = stageMap.map(function(s) {
        var n = s.key !== null ? (funnel[s.key] || 0) : ((funnel['A']||0) + (funnel['B']||0));
        return { stage: s.stage, sub: s.sub, n: n, pct: totalN > 0 ? (n / totalN) * 100 : 0 };
      });
    } else {
      rows = [];
    }
  }

  var totalIn = rows.length > 0 ? (rows[0].n || 0) : 0;
  var bodyHtml = rows.length === 0
    ? '<p style="color:var(--ink-3);font-size:13px">Keine Daten für diese Auswahl.</p>'
    : '<div class="fnl">' + rows.map(function(f, i) {
        var pct = f.pct || 0;
        return '<div class="fnl-row">' +
          '<div><div class="fnl-stage">' + escapeHtml(f.stage || '') + '</div><div class="fnl-stage-sub">' + escapeHtml(f.sub || '') + '</div></div>' +
          '<div class="fnl-track"><div class="fnl-bar" style="width:' + Math.max(0.2, pct) + '%;animation-delay:' + (i*70) + 'ms"></div></div>' +
          '<div class="fnl-n num">' + fmt(f.n) + '</div>' +
          '<div class="fnl-pct num">' + (pct < 1 ? pct.toFixed(1) : pct.toFixed(0)) + '%</div>' +
          '</div>';
      }).join('') + '</div>';

  root.innerHTML = '<div class="analyze"><h2>' + escapeHtml(heading) + '</h2>' +
    '<p class="lead">Wo stehen die ' + fmt(totalIn) + ' Records aktuell — und wo geht der Trichter verloren?</p>' +
    '<div class="an-section">' + bodyHtml + '</div></div>';
}

// ===== ANALYZE › COHORTS =====
function renderAnalyzeCohorts() {
  var root = document.getElementById('view-analyze');
  var bas = DATA.briefaktion_counts || [];

  var bodyHtml = bas.length === 0
    ? '<div style="color:var(--ink-3)">Noch keine Batches mit Daten</div>'
    : '<table class="cohort"><thead><tr>' +
      '<th>Batch</th><th class="r">Total</th><th class="r">Sent</th>' +
      '<th class="r">FU 1</th><th class="r">FU 2</th>' +
      '<th class="r">Contact</th><th class="r">Meeting</th><th class="r">Declined</th>' +
      '</tr></thead><tbody>' +
      bas.map(function(b) {
        var total = b.total || 0;
        var sent = b.sent || 0;
        var fu1 = b.followup1 || 0;
        var fu2 = b.followup2 || 0;
        var contact = b.contact || 0;
        var meeting = b.meeting || 0;
        var declined = b.declined || 0;
        function pct(n) { return sent > 0 ? '<span class="pct">' + Math.round(n/sent*100) + '%</span>' : ''; }
        return '<tr><td class="name">' + escapeHtml(b.briefaktion || '') + '</td>' +
          '<td class="r num">' + fmt(total) + '</td>' +
          '<td class="r num">' + fmt(sent) + (total > 0 ? '<span class="pct">' + Math.round(sent/total*100) + '%</span>' : '') + '</td>' +
          '<td class="r num">' + fmt(fu1) + pct(fu1) + '</td>' +
          '<td class="r num">' + fmt(fu2) + pct(fu2) + '</td>' +
          '<td class="r num">' + fmt(contact) + pct(contact) + '</td>' +
          '<td class="r num">' + fmt(meeting) + pct(meeting) + '</td>' +
          '<td class="r num">' + fmt(declined) + pct(declined) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';

  root.innerHTML = '<div class="analyze"><h2>Cohort Performance</h2>' +
    '<p class="lead">Outreach-Funnel pro Batch: Sent → Follow-Up → Contact → Meeting</p>' +
    '<div class="an-section">' + bodyHtml + '</div></div>';
}

// ===== ANALYZE › CLASSES =====
function renderAnalyzeClasses() {
  var root = document.getElementById('view-analyze');
  var descMap = { A:'Platform — Top-fit', B:'Add-on — Gut', C:'Unklar', D:'No-fit', E:'Special', S:'Konzerntochter' };
  var classes;
  var subtitle = 'über alle Batches';

  if (selectedBA) {
    subtitle = selectedBA;
    var filtered = getFilteredRows().filter(function(r){ return r.klass; });
    var counts = {};
    filtered.forEach(function(r){ counts[r.klass] = (counts[r.klass] || 0) + 1; });
    classes = Object.entries(counts)
      .sort(function(a,b){ return a[0].localeCompare(b[0]); })
      .map(function(e){ return { k: e[0], n: e[1], desc: descMap[e[0]] || e[0] }; });
  } else {
    var klass_counts = DATA.klass_counts || {};
    if (Array.isArray(klass_counts)) {
      classes = klass_counts;
    } else {
      classes = Object.entries(klass_counts)
        .sort(function(a,b){ return a[0].localeCompare(b[0]); })
        .map(function(e){ return { k: e[0], n: e[1], desc: descMap[e[0]] || e[0] }; });
    }
  }

  var total = classes.reduce(function(s, c){ return s + (c.n || 0); }, 0);
  var bodyHtml = classes.length === 0
    ? '<p style="color:var(--ink-3);font-size:13px">Keine Daten für diese Auswahl.</p>'
    : '<div class="cls-sum">' + classes.map(function(c) {
        var barW = total > 0 ? (c.n/total)*100 : 0;
        return '<div class="cls-cell"><div class="cls-letter">' + escapeHtml(c.k || '') + '</div>' +
          '<div class="cls-num num">' + fmt(c.n) + '</div>' +
          '<div class="cls-desc">' + escapeHtml(c.desc || '') + '</div>' +
          '<div class="cls-bar"><span style="width:' + barW + '%"></span></div></div>';
      }).join('') + '</div>';

  root.innerHTML = '<div class="analyze"><h2>Klassen-Verteilung</h2>' +
    '<p class="lead">' + fmt(total) + ' klassifizierte Records ' + escapeHtml(subtitle) + '.</p>' +
    '<div class="an-section">' + bodyHtml + '</div></div>';
}

// ===== ANALYZE › BOTTLENECKS =====
function renderAnalyzeBottlenecks() {
  var root = document.getElementById('view-analyze');
  var outreach = DATA.outreach_breakdown || {};
  var records = selectedBA ? getFilteredRows() : (DATA.records || []);
  var ab = records.filter(function(r){ return r.prio === 'Prio 1'; });
  var noEmail = ab.filter(function(r){ return !r.gf_email || !String(r.gf_email).trim(); }).length;
  var noCompliment = ab.filter(function(r){ return !r.compliment_draft || !String(r.compliment_draft).trim(); }).length;
  var noAddress = ab.filter(function(r){ return !r.street || !String(r.street).trim(); }).length;
  var ownershipPending = records.filter(function(r){ return r.pipeline_stage === 'ownership_review_needed'; }).length;

  var bottlenecks = [
    { label: 'Ohne E-Mail',     n: noEmail,         sev: noEmail > 20 ? 'block' : 'warn',  action: 'Enrich starten' },
    { label: 'Ohne Kompliment', n: noCompliment,    sev: noCompliment > 10 ? 'block' : 'warn', action: 'AI generieren' },
    { label: 'Ohne Adresse',    n: noAddress,       sev: noAddress > 10 ? 'block' : 'warn', action: 'Manuell prüfen' },
    { label: 'Ownership Review', n: ownershipPending, sev: ownershipPending > 0 ? 'warn' : '', action: 'Review starten' },
    { label: 'Sent',            n: outreach['sent'] || 0, sev: '', action: 'Anzeigen' },
    { label: 'Declined',        n: outreach['declined'] || 0, sev: 'block', action: 'Überprüfen' },
  ].filter(function(b){ return b.n > 0; });

  if (!bottlenecks.length) {
    bottlenecks = [{ label: 'Keine Bottlenecks', n: 0, sev: '', action: '' }];
  }

  root.innerHTML = '<div class="analyze"><h2>Aktuelle Bottlenecks</h2>' +
    '<p class="lead">Wo der Operator gerade Hand anlegen muss.</p>' +
    '<div class="an-section"><div class="bottle">' +
    bottlenecks.map(function(b) {
      return '<div class="bottle-card">' +
        '<div class="bottle-card-label">' + escapeHtml(b.label) + '</div>' +
        '<div class="bottle-card-num ' + escapeHtml(b.sev || '') + ' num">' + fmt(b.n) + '</div>' +
        '<div class="bottle-card-action">' + escapeHtml(b.action) + ' →</div>' +
        '</div>';
    }).join('') +
    '</div></div></div>';
}

// ===== WHAT'S NEW POPUP =====
(function() {
  if (!RELEASE_NOTES || !RELEASE_NOTES.version) return;
  var seen = localStorage.getItem('allex_seen_version');
  if (seen === RELEASE_NOTES.version) return;
  var sections = RELEASE_NOTES.sections || {};
  var bodyHtml = Object.keys(sections).map(function(sec) {
    var items = sections[sec];
    if (!items || !items.length) return '';
    return '<h4>' + escapeHtml(sec) + '</h4><ul>' +
      items.map(function(it){
        var s = escapeHtml(it);
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/`(.+?)`/g, '<code>$1</code>');
        return '<li>' + s + '</li>';
      }).join('') + '</ul>';
  }).join('');
  if (!bodyHtml) return;
  var overlay = document.createElement('div');
  overlay.className = 'wn-overlay';
  overlay.innerHTML = '<div class="wn-modal">' +
    '<button class="wn-close">&times;</button>' +
    '<h3>Was ist neu — ' + escapeHtml(RELEASE_NOTES.version) + '</h3>' +
    '<div class="wn-date">' + escapeHtml(RELEASE_NOTES.date) + '</div>' +
    bodyHtml +
    '<button class="wn-btn">Verstanden</button></div>';
  document.body.appendChild(overlay);
  function dismissWn() {
    localStorage.setItem('allex_seen_version', RELEASE_NOTES.version);
    overlay.remove();
  }
  overlay.querySelector('.wn-btn').onclick = dismissWn;
  overlay.querySelector('.wn-close').onclick = dismissWn;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) dismissWn(); });
})();
</script>
