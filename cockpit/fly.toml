# M5 — prepared, NOT deployed. Gate (DESIGN-SPEC §11): deploy only after the local trial
# confirms the tool earns its hosting, FF/fc-agent tokens issued, backups encrypted.
# Deploy: flyctl launch --copy-config; flyctl volumes create cockpit_data -r fra -s 1
app = "repuro-cockpit"
primary_region = "fra"

[build]

[mounts]
  source = "cockpit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
