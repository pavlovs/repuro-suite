<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ============================================================================
   REPURO CI — UNIFIED DESIGN SYSTEM
   Tokens + design-system classes inlined verbatim from context/repuro-ci.css
   (boardroom precedent). Dealroom v2 uses ONLY var(--ci-*) below this block.
   ========================================================================== */
:root {
  --ci-brand:    #0891B2;
  --ci-accent1:  #22D3EE;
  --ci-accent2:  #8DE8F6;
  --ci-alert:    #E11D48;
  --ci-warning:  #EAB308;
  --ci-accent5:  #A855F7;
  --ci-white:    #FFFFFF;
  --ci-black:    #000000;
  --ci-font: Arial, Helvetica, "Segoe UI", sans-serif;
  --ci-ink:      #000000;
  --ci-text:     rgba(0,0,0,.74);
  --ci-muted:    rgba(0,0,0,.54);
  --ci-line:     rgba(0,0,0,.12);
  --ci-surface:  #FFFFFF;
  --ci-canvas:   #F1FAFC;
  --stage-meeting_concluded:    #EAB308;
  --stage-valuation_rfi:        #3B82F6;
  --stage-indicative_offer:     #6366F1;
  --stage-loi_negotiation:      #D97706;
  --stage-loi_signed:           #A855F7;
  --stage-due_diligence:        #059669;
  --stage-contract_negotiation: #0D9488;
  --stage-closed:               #065F46;
  --stage-on_hold:              #6B7280;
  --stage-dead:                 #E11D48;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --radius: 12px; --radius-sm: 8px; --radius-pill: 999px;
  --fs-h1: 30px; --fs-h2: 22px; --fs-h3: 17px; --fs-h4: 14px;
  --fs-body: 14.5px; --fs-sm: 12.5px; --fs-label: 11px; --fs-display: 28px;
  --lh-tight: 1.18; --lh-normal: 1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html, body { font-family: var(--ci-font); color: var(--ci-text); background: var(--ci-canvas); }
body{font-size:var(--fs-body);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
h1, .h1 { font-size: var(--fs-h1); font-weight: 800; line-height: var(--lh-tight); color: var(--ci-ink); letter-spacing: -.01em; margin: 0; }
h2, .h2 { font-size: var(--fs-h2); font-weight: 700; line-height: var(--lh-tight); color: var(--ci-ink); margin: 0; }
h3, .h3 { font-size: var(--fs-h3); font-weight: 700; line-height: 1.3; color: var(--ci-ink); margin: 0; }
h4, .h4 { font-size: var(--fs-h4); font-weight: 700; line-height: 1.3; color: var(--ci-ink); margin: 0; }
p, .body { font-size: var(--fs-body); font-weight: 400; line-height: var(--lh-normal); color: var(--ci-text); margin: 0; }
.text-sm { font-size: var(--fs-sm); color: var(--ci-muted); }
.label { font-size: var(--fs-label); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ci-muted); }
.figure { font-size: var(--fs-display); font-weight: 800; line-height: 1.05; color: var(--ci-ink); font-variant-numeric: tabular-nums; }
.muted { color: var(--ci-muted); }
.num { font-variant-numeric: tabular-nums; }
.section-band { padding: var(--sp-4) var(--sp-5); display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); border-radius: var(--radius) var(--radius) 0 0; }
.section-band--brand  { background: var(--ci-brand);   color: var(--ci-white); }
.section-band--accent { background: var(--ci-accent2); color: var(--ci-black); }
.section-band h1, .section-band .h1, .section-band h2, .section-band .h2 { color: inherit; }
.card { background: var(--ci-surface); border: 1px solid var(--ci-line); border-radius: var(--radius); padding: var(--sp-5); }
.card--flush { padding: 0; overflow: hidden; }
.tile { background: var(--ci-surface); border: 1px solid var(--ci-line); border-radius: var(--radius-sm); padding: var(--sp-4); }
.btn { font-family: var(--ci-font); font-size: var(--fs-body); font-weight: 600; line-height: 1; padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: var(--sp-2); transition: background .12s, color .12s; text-decoration: none; }
.btn--primary { background: var(--ci-brand); color: var(--ci-white); }
.btn--primary:hover { background: color-mix(in srgb, var(--ci-brand) 85%, var(--ci-black)); }
.btn--ghost { background: transparent; color: var(--ci-brand); border-color: var(--ci-line); }
.btn--ghost:hover { background: var(--ci-canvas); }
.btn--sm { padding: 6px 12px; font-size: var(--fs-sm); }
.badge { display: inline-flex; align-items: center; font-size: var(--fs-label); font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); line-height: 1.4; }
.badge--brand  { background: rgba(8,145,178,.12); color: var(--ci-brand); }
.badge--muted  { background: rgba(0,0,0,.06);     color: var(--ci-muted); }
.badge--alert  { background: rgba(225,29,72,.12);  color: var(--ci-alert); }
.badge--stage { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.hr { border: none; border-top: 1px solid var(--ci-line); margin: var(--sp-4) 0; }

/* ============================================================================
   DEALROOM v2 PAGE SHELL — built on the tokens above only.
   ========================================================================== */
.wrap{max-width:1280px;margin:0 auto;padding:var(--sp-5) 26px 80px}
.wrap--foot{padding-top:0;padding-bottom:24px}
.topbar{background:var(--ci-brand);color:var(--ci-white);position:sticky;top:0;z-index:30}
.topbar-in{max-width:1280px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:14px}
.topbar .mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar .mark svg{width:19px;height:19px}
.topbar .wordmark{font-size:var(--fs-h3);font-weight:800;letter-spacing:.02em;color:var(--ci-white);text-decoration:none}
.topbar .room-tag{font-size:var(--fs-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:var(--radius-pill)}
.topbar .room-tag--sandbox{background:var(--ci-warning);color:var(--ci-black)}
.topbar nav{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.topbar nav a{color:var(--ci-white);opacity:.82;text-decoration:none;font-size:var(--fs-sm);font-weight:600;padding:6px 10px;border-radius:var(--radius-sm)}
.topbar nav a:hover{opacity:1;background:rgba(255,255,255,.12)}
.topbar nav a.active{opacity:1;background:rgba(255,255,255,.18)}
.topbar .user{font-size:var(--fs-sm);opacity:.85;margin-left:6px}

.pagehead{display:flex;align-items:baseline;gap:var(--sp-4);margin:var(--sp-5) 0 var(--sp-4);flex-wrap:wrap}
.pagehead .sub{color:var(--ci-muted);font-size:var(--fs-sm)}
.crumbs{font-size:var(--fs-sm);color:var(--ci-muted);margin-top:var(--sp-5)}
.crumbs a{color:var(--ci-brand);text-decoration:none}

.grid{display:grid;gap:var(--sp-4)}
.grid--2{grid-template-columns:repeat(2,1fr)}
.grid--3{grid-template-columns:repeat(3,1fr)}
.grid--4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.grid--3,.grid--4{grid-template-columns:repeat(2,1fr)}.grid--2{grid-template-columns:1fr}}
@media(max-width:640px){.grid--3,.grid--4{grid-template-columns:1fr}}

/* attention groups */
.group{margin-bottom:var(--sp-5)}
.group .card{border-radius:0 0 var(--radius) var(--radius);border-top:none}
.deal-row{display:flex;align-items:flex-start;gap:var(--sp-4);padding:var(--sp-4) 0;border-bottom:1px solid var(--ci-line);text-decoration:none;color:inherit}
.deal-row:last-child{border-bottom:none}
.deal-row:hover .deal-name{color:var(--ci-brand)}
.deal-row .deal-name{font-size:var(--fs-h3);font-weight:700;color:var(--ci-ink)}
.deal-row .company{color:var(--ci-muted);font-size:var(--fs-sm)}
.deal-row .main{flex:1;min-width:0}
.deal-row .meta{text-align:right;flex-shrink:0;max-width:340px}
.deal-row .meta .next{font-size:var(--fs-sm);color:var(--ci-text)}
.rowline{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-1)}
.chips{display:flex;gap:var(--sp-1);flex-wrap:wrap;margin-top:var(--sp-2)}
.chip{display:inline-flex;align-items:center;font-size:var(--fs-label);font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);line-height:1.5;border:1px solid var(--ci-line);color:var(--ci-muted);background:var(--ci-surface)}
.chip--alert{border-color:color-mix(in srgb, var(--ci-alert) 40%, transparent);color:var(--ci-alert);background:color-mix(in srgb, var(--ci-alert) 7%, var(--ci-white))}
.chip--warn{border-color:color-mix(in srgb, var(--ci-warning) 60%, transparent);color:color-mix(in srgb, var(--ci-warning) 60%, var(--ci-black));background:color-mix(in srgb, var(--ci-warning) 10%, var(--ci-white))}
.chip--info{border-color:color-mix(in srgb, var(--ci-brand) 35%, transparent);color:var(--ci-brand);background:color-mix(in srgb, var(--ci-brand) 6%, var(--ci-white))}
.parked{display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap;color:var(--ci-muted);font-size:var(--fs-sm)}
.parked .codes{color:var(--ci-text)}

/* source / as-of chip on figures (spec A3) */
.srcchip{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-label);color:var(--ci-muted);border:1px solid var(--ci-line);border-radius:var(--radius-pill);padding:2px 9px;background:var(--ci-surface)}
.figblock{display:flex;flex-direction:column;gap:var(--sp-2)}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
table.tbl th{font-size:var(--fs-label);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ci-muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--ci-line);background:var(--ci-surface)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--ci-line);vertical-align:top;text-align:left}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.r, table.tbl th.r{text-align:right}
table.tbl tbody tr:hover{background:color-mix(in srgb, var(--ci-brand) 3%, var(--ci-white))}
table.tbl a{color:var(--ci-brand);text-decoration:none;font-weight:600}

/* deal page */
.answer-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:var(--sp-4)}
@media(max-width:1080px){.answer-grid{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:var(--sp-3);padding:7px 0;border-bottom:1px solid var(--ci-line);align-items:baseline}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ci-muted);font-size:var(--fs-sm)}
.kv .v{font-weight:700;color:var(--ci-ink);text-align:right;font-variant-numeric:tabular-nums}
.flaglist{display:flex;flex-direction:column;gap:var(--sp-2)}
.flag{display:flex;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-sm);padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--ci-line);background:var(--ci-surface)}
.flag--alert{border-left:3px solid var(--ci-alert)}
.flag--warn{border-left:3px solid var(--ci-warning)}
.flag--info{border-left:3px solid var(--ci-accent1)}
.tabnav{display:flex;gap:2px;border-bottom:2px solid var(--ci-line);margin:var(--sp-6) 0 var(--sp-4);flex-wrap:wrap}
.tabnav a{padding:9px 15px;font-size:var(--fs-body);font-weight:600;color:var(--ci-muted);text-decoration:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;margin-bottom:-2px;border-bottom:2px solid transparent}
.tabnav a:hover{color:var(--ci-ink);background:var(--ci-surface)}
.tabnav a.active{color:var(--ci-brand);border-bottom-color:var(--ci-brand)}

/* timeline */
.timeline{list-style:none;position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--ci-line)}
.timeline li{position:relative;padding:0 0 var(--sp-4) 0}
.timeline li::before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ci-muted)}
.timeline li.k-stage::before{background:var(--ci-brand)}
.timeline li.k-artifact::before{background:var(--ci-accent1)}
.timeline li.k-round::before{background:var(--ci-accent5)}
.timeline li.k-milestone::before{background:var(--ci-warning)}
.timeline .t-date{font-size:var(--fs-label);color:var(--ci-muted);font-variant-numeric:tabular-nums}
.timeline .t-title{font-weight:700;color:var(--ci-ink)}
.timeline .t-detail{font-size:var(--fs-sm);color:var(--ci-muted);max-width:860px}

.empty{color:var(--ci-muted);font-size:var(--fs-sm);padding:var(--sp-4) 0}
footer.foot{margin-top:var(--sp-7);color:var(--ci-muted);font-size:var(--fs-label)}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <span class="mark"><svg viewBox="0 0 32 32" fill="none"><rect x="7" y="17.5" width="7.5" height="7.5" rx="2" fill="white"/><rect x="12.25" y="12.25" width="7.5" height="7.5" rx="2" fill="white" opacity=".78"/><rect x="17.5" y="7" width="7.5" height="7.5" rx="2" fill="white"/></svg></span>
  <a class="wordmark" href="{{BASE}}/">REPURO</a>
  <span class="room-tag">Dealroom</span>
  {{SANDBOX}}
  <nav>
    <a href="{{BASE}}/" class="{{NAV_ATTENTION}}">Attention</a>
    <a href="{{BASE}}/portfolio" class="{{NAV_PORTFOLIO}}">Portfolio</a>
    <a href="{{BASE}}/terms" class="{{NAV_TERMS}}">Terms</a>
    <a href="{{BASE}}/stakeholders" class="{{NAV_STAKEHOLDERS}}">Stakeholders</a>
    <a href="/cockpit/">Cockpit</a>
    <a href="/investor/">Investor</a>
    <span class="user">{{USER}}</span>
  </nav>
</div></div>
<div class="wrap">
