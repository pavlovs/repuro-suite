
  <div class="foot">
    <span><b>Repuro · Kamu Kapital</b> — investor room for Strada</span>
    <span>Data: Dealroom · Cockpit · Allex</span>
  </div>

</div>

<script>
// Chrome no longer replays cached basic-auth credentials on background fetch()
// calls — force credentials or whoami/inline-edit 401 behind Caddy (2026-07-06).
var _origFetch = window.fetch;
window.fetch = function (url, opts) {
  opts = opts || {};
  if (!opts.credentials) opts.credentials = "include";
  return _origFetch.call(window, url, opts);
};

// ---- agenda rail -> jump + active state ----
var items=[].slice.call(document.querySelectorAll('.agenda-item'));
function go(id){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
document.querySelectorAll('[data-go]').forEach(function(b){
  b.addEventListener('click',function(){go(this.getAttribute('data-go'));});
});
var acts=['act1','act2','act3','act4'];
function syncAgenda(){
  var pos=window.scrollY+150,cur='act1';
  acts.forEach(function(a){var e=document.getElementById(a);if(e&&e.offsetTop<=pos)cur=a;});
  items.forEach(function(it){it.classList.toggle('active',it.getAttribute('data-go')===cur);});
}
window.addEventListener('scroll',syncAgenda,{passive:true});
syncAgenda();

// ---- ACT 2 — live-deal toggle ----
var overviewOnlyViews=['scorecard','su'];
var allViewTabs=document.querySelectorAll('.view-tab');
function applyDeal(deal){
  document.querySelectorAll('.deal-panel').forEach(function(p){
    p.classList.toggle('active',p.id==='deal-'+deal);
  });
  document.querySelectorAll('.cdd-deal').forEach(function(c){
    c.classList.toggle('active',c.id==='cdd-'+deal);
  });
  document.querySelectorAll('.val-deal').forEach(function(c){
    c.classList.toggle('active',c.id==='val-'+deal);
  });
  document.querySelectorAll('.su-deal').forEach(function(c){
    c.classList.toggle('active',c.id==='su-'+deal);
  });
  var isOverview=(deal==='overview');
  allViewTabs.forEach(function(vt){
    var v=vt.getAttribute('data-view');
    var allowed=isOverview?overviewOnlyViews.indexOf(v)!==-1:true;
    vt.style.display=allowed?'':'none';
  });
  var activeVT=document.querySelector('.view-tab.active');
  if(activeVT&&activeVT.style.display==='none'){
    var first=document.querySelector('.view-tab[data-view="scorecard"]');
    if(first){first.click();}
  }
}
document.querySelectorAll('.deal-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    var deal=this.getAttribute('data-deal');
    document.querySelectorAll('.deal-tab').forEach(function(t){t.classList.toggle('active',t===tab);});
    applyDeal(deal);
  });
});

// ---- ACT 2 — view switch (LOI Scorecard / 1-pager / Valuation) ----
document.querySelectorAll('.view-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    var view=this.getAttribute('data-view');
    document.querySelectorAll('.view-tab').forEach(function(t){t.classList.toggle('active',t===tab);});
    document.querySelectorAll('.vgroup').forEach(function(g){
      g.classList.toggle('active',g.getAttribute('data-vg')===view);
    });
  });
});


// ---- ACT 3 — stage filter pills (verbatim table) ----
var ACTIVE_STAGES=['loi_signed','indicative_offer','valuation_rfi','meeting_concluded','due_diligence','contract_negotiation','closed'];
function applyStageFilter(f){
  document.querySelectorAll('.portfolio-table tbody tr').forEach(function(tr){
    var st=tr.getAttribute('data-stage');
    var show;
    if(f==='all') show=true;
    else if(f==='active') show=ACTIVE_STAGES.indexOf(st)!==-1;
    else show=(st===f);
    tr.style.display=show?'':'none';
  });
  recomputeSum();
}
document.querySelectorAll('.stage-filter .filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.stage-filter .filter-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
    applyStageFilter(this.getAttribute('data-filter'));
  });
});

function parseDE(s){return parseFloat(String(s).replace(',','.'));}
function fmtDE(n){return n.toFixed(1);}
function recomputeSum(){
  var rev=0,eb=0,emp=0;
  document.querySelectorAll('.portfolio-table tbody tr').forEach(function(tr){
    if(tr.style.display==='none') return;
    var c=tr.children;
    var r=parseDE(c[1].textContent); if(!isNaN(r)) rev+=r;
    var e=parseDE(c[2].textContent); if(!isNaN(e)) eb+=e;
    var m=parseInt(c[4].textContent,10); if(!isNaN(m)) emp+=m;
  });
  var sr=document.getElementById('sum-rev'); if(sr) sr.textContent=fmtDE(rev);
  var se=document.getElementById('sum-ebitda'); if(se) se.textContent=fmtDE(eb);
  var sm=document.getElementById('sum-emp'); if(sm) sm.textContent=emp;
}
// ---- ACT 3 — auto-sort portfolio rows by stage rank (template order preserved within a stage) ----
var STAGE_RANK=['closed','contract_negotiation','due_diligence','loi_signed','loi_negotiation','indicative_offer','valuation_rfi','meeting_concluded','on_hold','dead'];
(function(){
  var tb=document.querySelector('.portfolio-table tbody');
  if(!tb) return;
  Array.prototype.slice.call(tb.children)
    .map(function(tr,i){var r=STAGE_RANK.indexOf(tr.getAttribute('data-stage'));return {tr:tr,i:i,r:r===-1?STAGE_RANK.length:r};})
    .sort(function(a,b){return (a.r-b.r)||(a.i-b.i);})
    .forEach(function(o){tb.appendChild(o.tr);});
})();

applyStageFilter('active');

applyDeal('overview');

// ---- decision jump links ----
document.querySelectorAll('.dec-link').forEach(function(a){
  a.addEventListener('click',function(e){
    e.preventDefault();
    var id=this.getAttribute('href').replace('#','');
    var deal,view;
    if(id.indexOf('cdd-')===0){deal=id.replace('cdd-','');view='scorecard';}
    else if(id.indexOf('su-')===0){deal=id.replace('su-','');view='su';}
    else if(id==='dd-costs'){deal='overview';view='su';}
    if(deal){
      var dt=document.querySelector('.deal-tab[data-deal="'+deal+'"]');
      if(dt){dt.click();}
      var vt=document.querySelector('.view-tab[data-view="'+view+'"]');
      if(vt){vt.click();}
      setTimeout(function(){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);
    }
  });
});

// ---- inline edit (admin-only, persisted to investor.db) ----
(function(){
  // Slot visibility: ACT1 update tiles + decision rows carry data-slot; spare
  // slots (data-slot-extra) are hidden by default. State lives as ONE inline
  // edit under SLOT_KEY ({slot:1|0}) so it rides the existing persist/freeze/
  // clear-on-publish lifecycle — no server changes.
  var SLOT_KEY='__slots__';
  // Values normalize to 1|0 with the same strict rule as the server-side
  // publish strip (only an explicit 1/true is visible) — client display and
  // server privacy must never disagree on a slot.
  function parseSlots(raw){
    try{
      var s=JSON.parse(raw||'{}');
      if(!s||typeof s!=='object')return {};
      var out={};
      for(var k in s){out[k]=(s[k]===1||s[k]===true)?1:0;}
      return out;
    }catch(e){return {};}
  }
  function applySlots(state){
    document.querySelectorAll('[data-slot]').forEach(function(el){
      var s=el.getAttribute('data-slot');
      var vis=(state[s]!==undefined)?!!state[s]:!el.hasAttribute('data-slot-extra');
      el.classList.toggle('slot-off',!vis);
    });
    renumber();
  }
  function renumber(){
    var n=0;
    document.querySelectorAll('.changed-tile[data-slot]').forEach(function(el){
      if(el.classList.contains('slot-off'))return;
      n++;var c=el.querySelector('.cnum');if(c)c.textContent=n;
    });
    n=0;
    document.querySelectorAll('tr[data-slot]').forEach(function(el){
      if(el.classList.contains('slot-off'))return;
      n++;var c=el.querySelector('.dec-n');if(c)c.textContent=n;
    });
  }

  // Published snapshot: apply frozen edits + frozen slot state, skip fetch + contenteditable
  if(window.__INVESTOR_VIEW_PUBLISHED){
    var fe=window.__FROZEN_EDITS||{};
    document.querySelectorAll('[data-edit-id]').forEach(function(el){
      var eid=el.getAttribute('data-edit-id');
      if(fe[eid]!==undefined){el.innerHTML=fe[eid];}
    });
    applySlots(parseSlots(fe[SLOT_KEY]));
    return;
  }

  var toast=document.createElement('div');
  toast.className='edit-toast';
  document.body.appendChild(toast);
  var toastTimer;

  function showToast(msg,isErr){
    toast.textContent=msg;
    toast.classList.toggle('err',!!isErr);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show');},isErr?3000:1500);
  }

  fetch('api/whoami').then(function(r){return r.json();}).then(function(who){
    var isAdmin=who.role==='admin';
    return fetch('api/inline-edits').then(function(r){return r.json();}).then(function(d){
      var edits=d.edits||{};
      var els=document.querySelectorAll('[data-edit-id]');
      els.forEach(function(el){
        var eid=el.getAttribute('data-edit-id');
        if(edits[eid]!==undefined){el.innerHTML=edits[eid];el.classList.add('edit-dirty');}
      });
      var slots=parseSlots(edits[SLOT_KEY]);
      applySlots(slots);
      if(!isAdmin) return;
      var badge=document.createElement('span');
      badge.className='edit-badge';
      badge.textContent='EDIT MODE';
      var hdr=document.querySelector('.meta b');
      if(hdr) hdr.parentNode.insertBefore(badge,hdr.nextSibling);
      els.forEach(function(el){
        el.setAttribute('contenteditable','true');
        el.classList.add('editable');
        var orig=el.innerHTML;
        el.addEventListener('focus',function(){orig=el.innerHTML;});
        el.addEventListener('blur',function(){
          var now=el.innerHTML;
          if(now===orig) return;
          var eid=el.getAttribute('data-edit-id');
          fetch('api/inline-edit',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({edit_id:eid,content:now})
          }).then(function(r){
            if(r.ok){showToast('Saved');el.classList.add('edit-dirty');}
            else{showToast('Save failed',true);}
          }).catch(function(){showToast('Network error',true);});
        });
      });

      // ---- slot add/remove controls (admin draft only) ----
      // Saves are chained: each request snapshots state at click time and requests
      // run strictly in order, so rapid add/remove/undo can't land out of order
      // and overwrite a newer visibility map with an older one.
      var slotSaveChain=Promise.resolve();
      function saveSlots(){
        var payload=JSON.stringify({edit_id:SLOT_KEY,content:JSON.stringify(slots)});
        slotSaveChain=slotSaveChain.then(function(){
          return fetch('api/inline-edit',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:payload
          }).then(function(r){
            if(!r.ok){showToast('Save failed',true);}
          });
        }).catch(function(){showToast('Network error',true);});
      }
      function showUndo(msg,fn){
        toast.innerHTML='';
        toast.appendChild(document.createTextNode(msg+' '));
        var a=document.createElement('a');
        a.textContent='Undo';a.href='#';
        a.style.cssText='color:#fff;text-decoration:underline;pointer-events:auto';
        a.addEventListener('click',function(e){e.preventDefault();fn();toast.classList.remove('show');});
        toast.appendChild(a);
        toast.classList.remove('err');toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer=setTimeout(function(){toast.classList.remove('show');},6000);
      }
      document.querySelectorAll('[data-slot]').forEach(function(el){
        var s=el.getAttribute('data-slot');
        var x=document.createElement('button');
        x.className='slot-x';x.textContent='×';x.title='Remove';
        x.setAttribute('contenteditable','false');
        x.addEventListener('click',function(){
          slots[s]=0;applySlots(slots);saveSlots();
          showUndo('Removed.',function(){slots[s]=1;applySlots(slots);saveSlots();});
        });
        (el.tagName==='TR'?el.querySelector('.dec-num'):el).appendChild(x);
      });
      function revealNext(prefix,label){
        // first hidden spare in DOM order; fall back to a removed standard slot
        var hidden=[].slice.call(document.querySelectorAll('[data-slot^="'+prefix+'"].slot-off'));
        var el=null;
        for(var i=0;i<hidden.length;i++){if(hidden[i].hasAttribute('data-slot-extra')){el=hidden[i];break;}}
        if(!el&&hidden.length)el=hidden[0];
        if(!el){showToast('No more '+label+' slots',true);return;}
        slots[el.getAttribute('data-slot')]=1;
        applySlots(slots);saveSlots();
        var t=el.querySelector('[data-edit-id]');
        if(t){t.focus();}
      }
      function addBtn(label,onclick,afterEl){
        if(!afterEl)return;
        var b=document.createElement('button');
        b.className='slot-add';b.textContent='+ '+label;
        b.addEventListener('click',onclick);
        afterEl.parentNode.insertBefore(b,afterEl.nextSibling);
      }
      addBtn('Add update',function(){revealNext('tile-','update');},document.querySelector('.changed-grid'));
      addBtn('Add decision',function(){revealNext('dec-','decision');},document.querySelector('.dec-table'));
    });
  }).catch(function(e){/* no auth = static view, nothing to do */});
})();

</script>
</body>
</html>
