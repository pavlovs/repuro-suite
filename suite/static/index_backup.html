<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repuro Suite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Aptos Narrow', Arial, sans-serif; background: #0f2832; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; max-width: 480px; padding: 40px 24px; }
  h1 { font-size: 28px; color: #0891B2; margin-bottom: 6px; font-weight: 700; }
  .subtitle { font-size: 13px; color: #64748b; margin-bottom: 36px; }
  .cards { display: flex; flex-direction: column; gap: 14px; }
  a.card { display: block; background: #1a3a4a; border: 1px solid #234a5a; border-radius: 10px; padding: 20px 24px; text-decoration: none; color: #e2e8f0; transition: border-color 0.15s, background 0.15s; text-align: left; }
  a.card:hover { border-color: #0891B2; background: #1e4050; }
  .card-title { font-size: 17px; font-weight: 600; color: #0891B2; margin-bottom: 4px; }
  .card-desc { font-size: 13px; color: #94a3b8; line-height: 1.4; }
  .footer { margin-top: 40px; font-size: 11px; color: #475569; }
</style>
</head>
<body>
<div class="container">
  <h1>Repuro Suite</h1>
  <p class="subtitle">Internal tools</p>
  <div class="cards">
    <a href="/allex/" class="card">
      <div class="card-title">ALLEX Pipeline</div>
      <div class="card-desc">Lead sourcing, enrichment, classification. 2,400+ records.</div>
    </a>
    <a href="/deals/" class="card">
      <div class="card-title">Dealroom</div>
      <div class="card-desc">Deal tracking, financials, scoring, portfolio view.</div>
    </a>
    <a href="/cockpit/" class="card">
      <div class="card-title">Cockpit</div>
      <div class="card-desc">Workstreams, tasks, blockers, agent queue.</div>
    </a>
  </div>
  <div class="footer">Repuro Capital Partners</div>
</div>
</body>
</html>
