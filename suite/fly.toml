app = "repuro-suite"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "suite_data"
  destination = "/data"

[env]
  # ALLEX
  PIPELINE_DB_PATH = "/data/pipeline.db"
  # DEALROOM
  DEALROOM_DB_PATH = "/data/dealroom.db"
  DEALROOM_REQUIRE_DB = "1"
  ALLEX_PIPELINE_DB = "/data/pipeline.db"
  # COCKPIT
  COCKPIT_DB = "/data/cockpit.db"
  COCKPIT_DEALROOM_DB = "/data/dealroom.db"
  COCKPIT_BASE_PATH = "/cockpit"
  # X-Remote-User is only honored behind Caddy (which overwrites the header
  # from basic auth). Never set this on a directly-exposed instance.
  COCKPIT_TRUSTED_PROXY = "1"
  # INVESTOR ROOM (AUTH_INVESTOR_HASH is a Fly secret, not set here — Strada access deferred)
  INVESTOR_DB = "/data/investor.db"
  INVESTOR_DEALROOM_DB = "/data/dealroom.db"
  INVESTOR_PIPELINE_DB = "/data/pipeline.db"
  INVESTOR_COCKPIT_DB = "/data/cockpit.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"
