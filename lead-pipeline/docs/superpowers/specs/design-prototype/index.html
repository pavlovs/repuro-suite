<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>ALLEX — Lead Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-v3.css?v=2">
</head>
<body>

<div class="app" id="app">

  <aside class="side">
    <div class="side-brand">AX</div>
    <div class="side-modes">
      <div class="side-mode active" data-mode="review" title="Review">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span class="side-mode-label">Review · Assembly Line</span>
      </div>
      <div class="side-mode" data-mode="analyze" title="Analyze">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-7"/></svg>
        <span class="side-mode-label">Analyze · Performance</span>
      </div>
    </div>
    <div class="side-foot">RD</div>
  </aside>

  <header class="top">
    <div>
      <div class="top-title" id="top-title">Review</div>
      <div class="top-sub" id="top-sub">Was fehlt, damit Records exportbereit sind</div>
    </div>
    <div class="top-spacer"></div>
    <div class="top-ba">
      <span class="muted">Briefaktion</span>
      <select>
        <option>BA #7 — Niederrhein</option>
        <option>BA #6 — Ruhrgebiet</option>
        <option>BA #5 — Bayern Süd</option>
        <option>Alle Briefaktionen</option>
      </select>
    </div>
    <button class="icon-btn" id="toggle-tweaks" title="Tweaks">
      <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/></svg>
    </button>
  </header>

  <nav class="subnav" id="subnav"></nav>

  <main class="main">
    <div class="view active" id="view-review"></div>
    <div class="view" id="view-analyze"></div>
  </main>
</div>

<div class="tweaks" id="tweaks">
  <div class="tweaks-head">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/></svg>
    Tweaks
    <button class="icon-btn" style="margin-left:auto" onclick="document.getElementById('tweaks').classList.remove('open')">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="tweaks-body">
    <div>
      <div class="tweak-label">Sort queue by</div>
      <div class="seg" data-tweak="sort">
        <button class="active" data-v="ready">Closest to ready</button>
        <button data-v="block">Most blocked</button>
      </div>
    </div>
    <div>
      <div class="tweak-label">Funnel style</div>
      <div class="seg" data-tweak="funnel">
        <button class="active" data-v="bar">Bars</button>
        <button data-v="step">Stepped</button>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
