[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:allex]
command=python /app/allex/pipeline.py dashboard --serve --port 8081
directory=/app/allex
environment=BASE_PATH="/allex"
user=appuser
priority=100
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dealroom]
command=python /app/dealroom/DEALROOM.py dashboard --serve --port 8082
directory=/app/dealroom
environment=BASE_PATH="/deals"
user=appuser
priority=200
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cockpit]
command=python /app/cockpit/cockpit.py serve --port 8083
directory=/app/cockpit
user=appuser
priority=300
startsecs=5
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
user=appuser
priority=999
startsecs=2
startretries=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
