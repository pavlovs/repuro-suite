<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --ink: #111827;
    --secondary: #4b5563;
    --muted: #9ca3af;
    --border: rgba(0,0,0,0.07);
    --border-hover: rgba(0,0,0,0.14);
    --brand: #0891B2;
    --brand-light: #ecfeff;
    --orange: #ea580c;
    --orange-light: #fff7ed;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    flex: 1;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 1fr auto;
    height: 100vh;
  }

  /* --- Left panel --- */
  .panel-left {
    grid-row: 1 / -1;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px;
  }
  .brand-logo { width: 180px; height: auto; margin-bottom: 32px; }
  .brand-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--brand); margin-bottom: 12px;
  }
  .brand-desc {
    font-size: 14px; line-height: 1.6; color: var(--secondary); max-width: 260px;
  }

  /* --- Right content with background --- */
  .panel-right {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 64px;
    gap: 16px;
    overflow: hidden;
  }

  /* --- Cards --- */
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 24px;
    padding: 30px 32px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms var(--ease);
    max-width: 620px;
  }
  .card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    transform: translateY(-2px);
  }
  .card:active {
    transform: translateY(0);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .card-icon {
    width: 56px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .card.cockpit .card-icon { background: var(--brand-light); }
  .card.allex .card-icon { background: var(--orange-light); }
  .card.deals .card-icon { background: var(--blue-light); }

  .card.cockpit .card-icon svg { width: 30px; height: 30px; }
  .card.allex .card-icon img { width: 34px; height: 34px; object-fit: contain; }
  .card.deals .card-icon svg { width: 26px; height: 26px; stroke: var(--blue); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .card-name {
    font-size: 17px; font-weight: 650; color: var(--ink); margin-bottom: 3px; letter-spacing: -0.01em;
  }
  .card-desc {
    font-size: 14px; color: var(--secondary); line-height: 1.45;
  }

  .card-arrow {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    transition: background 150ms ease;
  }
  .card:hover .card-arrow { background: rgba(0,0,0,0.04); }
  .card-arrow svg {
    width: 18px; height: 18px; stroke: var(--muted); stroke-width: 2;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
    transition: stroke 150ms ease, transform 150ms var(--ease);
  }
  .card:hover .card-arrow svg { transform: translateX(3px); }
  .card.cockpit:hover .card-arrow svg { stroke: var(--brand); }
  .card.allex:hover .card-arrow svg { stroke: var(--orange); }
  .card.deals:hover .card-arrow svg { stroke: var(--blue); }

  /* --- Status bar --- */
  .statusbar {
    padding: 14px 64px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
  }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--brand);
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; position: relative; flex-shrink: 0;
  }
  .avatar::after {
    content: ""; position: absolute; bottom: -1px; right: -1px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; border: 2px solid white;
  }
  .user-name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .user-sep { color: var(--muted); font-size: 13px; }
  .user-email { font-size: 13px; color: var(--muted); }
  .status-meta { font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: slideIn 0.35s var(--ease) both; }
    .card:nth-child(1) { animation-delay: 40ms; }
    .card:nth-child(2) { animation-delay: 90ms; }
    .card:nth-child(3) { animation-delay: 140ms; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  }

  @media (max-width: 800px) {
    html, body { overflow: auto; }
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: auto; min-height: 100vh; }
    .panel-left { padding: 32px 24px; border-right: none; border-bottom: 1px solid var(--border); }
    .panel-right { padding: 24px; }
    .card { max-width: none; }
    .statusbar { padding: 12px 24px; }
    .brand-logo { width: 140px; }
  }
</style>
</head>
